name: Site (Stable + Beta)
# Stable = html of the latest Stable tag (vX.Y.Z, made only on GO STABLE) at /, Beta = html of MAIN at /beta/ (main changes only on GO BETA).
# (2026-11-02, B1: before, the Beta was the html of ANY branch with a green Checks run, so a helper branch pushed for review replaced the
# Beta of the user. A green Checks run of another branch does nothing here now.)
# (2026-10-28: main carries the Beta under test, so the Stable page no longer follows main.) The apk / exe load these pages, so they update by themselves.
on:
  workflow_run: { workflows: [Checks], types: [completed] }
  workflow_dispatch: # by hand (after a GO STABLE release: the Stable page takes the new tag at once); the Beta is main
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: stable, fetch-depth: 0 }
      - name: Stable = the latest Stable tag
        run: |
          cd stable
          T=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          test -n "$T" && git checkout -q "$T" && echo "Stable page: $T"
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.workflow_run.head_sha || ''main'' }}', path: beta }
      - name: Assemble
        run: |
          mkdir -p site/beta
          S=$(ls stable/dist/logic-sim-v*.html stable/logic-sim-v*.html 2>/dev/null | head -1); B=$(ls beta/dist/logic-sim-v*.html beta/logic-sim-v*.html 2>/dev/null | head -1)
          cp "$S" site/index.html; cp "$B" site/beta/index.html
          sv=$(echo "$S" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?'); bv=$(echo "$B" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?')
          echo "{\"stable\":\"$sv\",\"beta\":\"$bv\"}" > site/version.json
          for f in sw.js manifest.webmanifest icon-192.png icon-512.png; do for d in delivery/pwa .; do [ -f "stable/$d/$f" ] && { cp "stable/$d/$f" site/; break; }; done; for d in delivery/pwa .; do [ -f "beta/$d/$f" ] && { cp "beta/$d/$f" site/beta/; break; }; done; [ -f "site/beta/$f" ] || cp "site/$f" site/beta/; done
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
