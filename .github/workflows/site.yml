name: Site (Stable + Beta)
# Stable = html of the latest Stable tag (vX.Y.Z, made only on GO STABLE) at /, Beta = html of MAIN at /beta/ (main changes only on GO BETA).
# (2026-11-02, B1: before, the Beta was the html of ANY branch with a green Checks run, so a helper branch pushed for review replaced the
# Beta of the user. A green Checks run of another branch does nothing here now.)
# (2026-10-28: main carries the Beta under test, so the Stable page no longer follows main.) The apk / exe load these pages, so they update by themselves.
on:
  workflow_run: { workflows: [Checks], types: [completed] }
  workflow_dispatch: # by hand (after a GO STABLE release: the Stable page takes the new tag at once); the Beta is main
permissions: { contents: read, pages: write, id-token: write }
# 2026-11-11: the concurrency is on the job, not the workflow. A Checks run of another branch starts this workflow too; at the
# workflow level that skipped run took the group and CANCELLED the deploy of main (run 42934546368, beta.67 never reached the
# Beta page). A skipped job never joins the group. No cancel: a running deploy finishes and the next one queues after it.
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    concurrency: { group: pages, cancel-in-progress: false }
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: stable, fetch-depth: 0 }
      - name: Stable = the latest Stable tag
        run: |
          cd stable
          T=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          test -n "$T" && git checkout -q "$T" && echo "Stable page: $T"
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.workflow_run.head_sha || ''main'' }}', path: beta }
      - name: Assemble
        run: |
          mkdir -p site/beta
          S=$(ls stable/dist/logic-sim-v*.html stable/logic-sim-v*.html 2>/dev/null | head -1); B=$(ls beta/dist/logic-sim-v*.html beta/logic-sim-v*.html 2>/dev/null | head -1)
          cp "$S" site/index.html; cp "$B" site/beta/index.html
          sv=$(echo "$S" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?'); bv=$(echo "$B" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?')
          echo "{\"stable\":\"$sv\",\"beta\":\"$bv\"}" > site/version.json
          for f in sw.js manifest.webmanifest icon-192.png icon-512.png; do for d in delivery/pwa .; do [ -f "stable/$d/$f" ] && { cp "stable/$d/$f" site/; break; }; done; for d in delivery/pwa .; do [ -f "beta/$d/$f" ] && { cp "beta/$d/$f" site/beta/; break; }; done; [ -f "site/beta/$f" ] || cp "site/$f" site/beta/; done
          # 2026-11-16: the Plant Tools web app (docs/plant-tools/app, built by docs/plant-tools/build-app.js) is served from main at /tools/. It does not touch the simulator pages.
          [ -d beta/docs/plant-tools/app ] && cp -r beta/docs/plant-tools/app site/tools || echo "no Plant Tools app in this commit"
          # 2026-11-18: the Operator Station (src/station, built by tools/station/build.js from the same html) is its own app at /station/ (Stable)
          # and /station/beta/ (Beta), with its own version.json, manifest, icons and copy of the service worker. It does not touch the simulator pages.
          # A Stable tag from before the station has no tools/station: /station/ then only points to the Beta.
          if [ -f beta/tools/station/build.js ]; then
            mkdir -p site/station/beta
            node beta/tools/station/build.js "$B" site/station/beta/index.html; tb=$bv; ts=""
            if [ -f stable/tools/station/build.js ]; then node stable/tools/station/build.js "$S" site/station/index.html; ts=$sv; P=stable
            else P=beta; printf '%s' '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 1 Operator Station</title><meta http-equiv="refresh" content="0;url=beta/"><p style="font:16px system-ui;margin:24px">Unit 1 Operator Station has no Stable release yet. <a href="beta/">Open the Beta</a>.</p>' > site/station/index.html; fi
            echo "{\"stable\":\"$ts\",\"beta\":\"$tb\"}" > site/station/version.json
            for f in manifest.webmanifest icon-192.png icon-512.png; do cp "beta/delivery/station/pwa/$f" site/station/beta/; cp "$P/delivery/station/pwa/$f" site/station/; done
            cp beta/delivery/pwa/sw.js site/station/beta/sw.js; cp "$P/delivery/pwa/sw.js" site/station/sw.js
          else echo "no Operator Station in this commit"; fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
