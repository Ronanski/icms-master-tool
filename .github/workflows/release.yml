name: Release apk + exe
# Manual. Assets: html, apk, portable exe (one each: Stable; the app has a Stable / Beta switch inside), release report pdf, UAT form. Beta is never a release: it is the html of a pushed branch on the Beta page. input go must be exactly "GO v<version>" (the version in the html file name). Builds the Stable and Beta shells
# (apk + portable exe). The shells load the site, so they only need a rebuild when the shell itself changes.
# The app content is released by merging to main (Stable) or pushing a branch (Beta).
# apk signing: signing/logic-sim.jks (self-signed, alias logicsim, made once). Never regenerate it: a new key means a reinstall.
on:
  workflow_dispatch:
    inputs:
      go: { description: 'Type exactly: GO v<version>', required: true, type: string }
      dry_run: { description: 'true = build only, no GitHub Release', required: true, default: 'true', type: choice, options: ['true','false'] }
permissions: { contents: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { version: '${{ steps.v.outputs.version }}', tag: '${{ steps.v.outputs.tag }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: v
        run: |
          node tools/version.js --github
          V=$(node tools/version.js)
          [ "${{ inputs.go }}" = "GO v$V" ] || { echo "go must be exactly: GO v$V"; exit 1; }
  apk:
    needs: gate
    runs-on: ubuntu-latest
    env:
      KS_PASS: logicsim-icms
    strategy:
      matrix:
        include:
          - { chan: stable, id: com.ronanski.logicsim, name: 'Logic Sim', url: 'https://ronanski.github.io/icms-master-tool/' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor project
        working-directory: android-app
        run: |
          cat > capacitor.config.json <<EOF
          {"appId":"${{ matrix.id }}","appName":"${{ matrix.name }}","webDir":"www","server":{"url":"${{ matrix.url }}","errorPath":"offline.html","androidScheme":"https"}}
          EOF
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          sed -i "s/versionName \".*\"/versionName \"${{ needs.gate.outputs.version }}\"/" android/app/build.gradle
      - name: Build + sign
        working-directory: android-app/android
        run: |
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../../signing/logic-sim.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias logicsim --out "../../logic-sim-${{ matrix.chan }}.apk" aligned.apk
          $BT/apksigner verify "../../logic-sim-${{ matrix.chan }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: 'apk-${{ matrix.chan }}', path: 'logic-sim-${{ matrix.chan }}.apk' }
  exe:
    needs: gate
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { chan: stable, name: 'Logic Sim', url: 'https://ronanski.github.io/icms-master-tool/' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build portable exe
        working-directory: app
        shell: bash
        run: |
          echo '{"name":"${{ matrix.name }}","url":"${{ matrix.url }}"}' > config.json
          npm install --no-audit --no-fund
          npx electron-builder --win portable -c.productName="${{ matrix.name }}" -c.extraMetadata.version=${{ needs.gate.outputs.version }}
          ls dist
      - uses: actions/upload-artifact@v4
        with: { name: 'exe-${{ matrix.chan }}', path: 'app/dist/*-portable.exe' }
  publish:
    needs: [gate, apk, exe]
    if: inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=${{ needs.gate.outputs.version }}
          T=${{ needs.gate.outputs.tag }}
          mkdir rel
          find out -type f -name '*.apk' -print0 | while IFS= read -r -d '' f; do cp "$f" "rel/Logic-Sim-v$V.apk"; done
          find out -type f -name '*.exe' -print0 | while IFS= read -r -d '' f; do cp "$f" "rel/Logic-Sim-v$V-portable.exe"; done
          # no Beta in the releases: remove beta assets and beta pre-releases of earlier uploads
          for r in $(gh release list --json tagName -q '.[].tagName'); do
            for n in $(gh release view "$r" --json assets -q '.assets[].name' | grep -i beta || true); do gh release delete-asset "$r" "$n" -y || true; done
          done
          for r in $(gh release list --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName'); do gh release delete "$r" -y --cleanup-tag || true; done
          cp "logic-sim-v$V.html" rel/
          cp "docs/versions/v$V/Release-Report-v$V.pdf" rel/
          cp "docs/versions/v$V/UAT-v$V.html" rel/
          ls rel
          NOTES="Stable v$V. Files: logic-sim-v$V.html (the simulator), Logic-Sim-v$V.apk (Android), Logic-Sim-v$V-portable.exe (Windows, portable). The apps load the site and update by themselves; inside the app, the Channel box (top right) switches between Stable and Beta. Release-Report-v$V.pdf (what changed and what was checked), UAT-v$V.html (the acceptance test form, open it in the phone or tablet browser)."
          if gh release view "$T" >/dev/null 2>&1; then
            gh release upload "$T" rel/* --clobber
          else
            gh release create "$T" rel/* --title "Logic Sim $T" --notes "$NOTES" --target "${{ github.sha }}"
          fi
