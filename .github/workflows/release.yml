name: Release apk + exe
# Manual. Assets: html, apk, portable exe (one each: Stable; the app has a Stable / Beta switch inside), release report pdf. No UAT file in the release (the UAT is inside the app). Beta is never a release: it is the html of a pushed branch on the Beta page. input go must be exactly "GO v<version>" (the version in the html file name). Builds the Stable and Beta shells
# (apk + portable exe). The apk and the exe have the simulator built in (offline); the page asks the site for a newer version and the user chooses.
# The app content is released by merging to main (Stable) or pushing a branch (Beta).
# apk signing: delivery/signing/logic-sim.jks (self-signed, alias logicsim, made once). Never regenerate it: a new key means a reinstall.
on:
  workflow_dispatch:
    inputs:
      go: { description: 'Type exactly: GO v<version>', required: true, type: string }
      dry_run: { description: 'true = build only, no GitHub Release', required: true, default: 'true', type: choice, options: ['true','false'] }
permissions: { contents: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { version: '${{ steps.v.outputs.version }}', tag: '${{ steps.v.outputs.tag }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: v
        run: |
          node tools/version.js --github
          V=$(node tools/version.js)
          case "$V" in *-beta*) echo "v$V is a Beta: set src/version.txt to the Stable number (no -beta.N) before the release"; exit 1;; esac
          [ "${{ inputs.go }}" = "GO v$V" ] || { echo "go must be exactly: GO v$V"; exit 1; }
  apk:
    needs: gate
    runs-on: ubuntu-latest
    env:
      KS_PASS: logicsim-icms
    strategy:
      matrix:
        include:
          - { chan: stable, id: com.ronanski.logicsim, name: 'DCS Logic Simulator', url: 'https://ronanski.github.io/icms-master-tool/' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor project
        working-directory: delivery/android
        run: |
          cat > capacitor.config.json <<EOF
          {"appId":"${{ matrix.id }}","appName":"${{ matrix.name }}","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          # the simulator is built into the apk as a FOLDER (index.html + js/*.js, same content as the single html; opens at once, works without internet); the page asks the site for updates
          node ../../tools/build/app-folder.js "../../dist/logic-sim-v${{ needs.gate.outputs.version }}.html" www
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # app icon (delivery/icons): launcher icons of every density + adaptive icon background
          cp -r ../icons/android/res/. android/app/src/main/res/
          sed -i "s/versionName \".*\"/versionName \"${{ needs.gate.outputs.version }}\"/" android/app/build.gradle
      - name: Build + sign
        working-directory: delivery/android/android
        run: |
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../../signing/logic-sim.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias logicsim --out "../../logic-sim-${{ matrix.chan }}.apk" aligned.apk
          $BT/apksigner verify "../../logic-sim-${{ matrix.chan }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: 'apk-${{ matrix.chan }}', path: 'delivery/logic-sim-${{ matrix.chan }}.apk' }
  exe:
    needs: gate
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - { chan: stable, name: 'DCS Logic Simulator', url: 'https://ronanski.github.io/icms-master-tool/' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build portable exe
        working-directory: delivery/desktop
        shell: bash
        run: |
          echo '{"name":"${{ matrix.name }}","url":"${{ matrix.url }}"}' > config.json
          node ../../tools/build/app-folder.js "../../dist/logic-sim-v${{ needs.gate.outputs.version }}.html" www
          # app icon (delivery/icons): the exe file icon and the window icon
          mkdir -p build && cp ../icons/icon.ico build/icon.ico && cp ../icons/png/icon-256.png icon.png
          npm install --no-audit --no-fund
          npx electron-builder --win portable -c.productName="${{ matrix.name }}" -c.extraMetadata.version=${{ needs.gate.outputs.version }}
          ls dist
      - uses: actions/upload-artifact@v4
        with: { name: 'exe-${{ matrix.chan }}', path: 'delivery/desktop/dist/*-portable.exe' }
  publish:
    needs: [gate, apk, exe]
    if: inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=${{ needs.gate.outputs.version }}
          T=${{ needs.gate.outputs.tag }}
          mkdir rel
          find out -type f -name '*.apk' -print0 | while IFS= read -r -d '' f; do cp "$f" "rel/DCS-Logic-Simulator-$V.apk"; done
          find out -type f -name '*.exe' -print0 | while IFS= read -r -d '' f; do cp "$f" "rel/DCS-Logic-Simulator-$V-Windows.exe"; done
          # no Beta in the releases: remove beta assets and beta pre-releases of earlier uploads
          for r in $(gh release list --json tagName -q '.[].tagName'); do
            for n in $(gh release view "$r" --json assets -q '.assets[].name' | grep -i beta || true); do gh release delete-asset "$r" "$n" -y || true; done
          done
          for r in $(gh release list --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName'); do gh release delete "$r" -y --cleanup-tag || true; done
          cp "dist/logic-sim-v$V.html" "rel/DCS-Logic-Simulator-$V.html"
          cp "docs/versions/v$V/Release-Report-v$V.pdf" "rel/DCS-Logic-Simulator-$V-Report.pdf"
          ls rel
          NOTES="DCS Logic Simulator $V (Stable). Files: DCS-Logic-Simulator-$V.apk (Android), DCS-Logic-Simulator-$V-Windows.exe (Windows, portable, no install), DCS-Logic-Simulator-$V.html (opens in a browser). The apps load the site and update by themselves; inside the app, the Channel box (top right) switches between Stable and Beta. DCS-Logic-Simulator-$V-Report.pdf (what changed and what was checked)."
          if gh release view "$T" >/dev/null 2>&1; then
            gh release upload "$T" rel/* --clobber
          else
            gh release create "$T" rel/* --title "DCS Logic Simulator $T" --notes "$NOTES" --target "${{ github.sha }}"
          fi
