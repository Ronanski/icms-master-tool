name: Simulation tests
# 3.2.1 p4: the simulation runs by itself on every push (headless Chromium): T1 ~ S5 of the ABC engine, the engine alone,
# the DITL 150 MW plant. Report only for now: it does not hold the Beta (site.yml follows Checks, not this workflow).
on: [push]
permissions: { contents: read }
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$PWD/node_modules/playwright" >> "$GITHUB_ENV"
          echo "CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Engine alone (54 ABC sheets, same values as the whole simulator)
        if: always()
        run: node tests/engine/isolated.js
      - name: ABC engine T1 ~ S5 (sheets load and step, timers, lag, alarms, blocks, F-30 / F-27 / P-1 / F-31)
        if: always()
        run: node tests/regress/tests.js
      - name: DITL 150 MW (no MFT, equipment running, DITL to ABC, 60 s steady, BFWP A stop, Reset = cold)
        if: always()
        run: node tests/regress/ditl150.js
