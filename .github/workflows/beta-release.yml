name: Beta release

# Manual only. Publishes a GitHub pre-release with the simulator HTML of the chosen commit.
# Use only after the user's GO BETA (PROJECT_RULES section 4). The .apk and .exe are NOT built here:
# The apk / exe shells are built by release.yml; they load the site, so they carry no app logic.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.20.22-beta.1
      target:
        description: Commit SHA or branch to release
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          F=$(ls logic-sim-v*.html)
          gh release create "$TAG" "$F" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title "$TAG" \
            --notes "Beta of the ABC audit corrections, see docs/versions/ (UPDATE_REPORT.md of this version). Contains only the simulator html $F."
