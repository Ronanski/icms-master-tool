name: Make signing key (once)
# Manual. Creates the self-signed apk signing key signing/logic-sim.jks on the GitHub runner and commits it, only if it does not exist yet.
# Never run it again after the first time: a new key means every installed apk must be uninstalled first.
on: workflow_dispatch
permissions: { contents: write }
jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Create key if missing
        run: |
          if [ -f signing/logic-sim.jks ]; then echo "key already exists, nothing to do"; exit 0; fi
          mkdir -p signing
          keytool -genkeypair -noprompt -alias logicsim -keyalg RSA -keysize 2048 -validity 12000 -keystore signing/logic-sim.jks -storepass logicsim-icms -keypass logicsim-icms -dname "CN=Ronanski, O=icms-master-tool"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signing/logic-sim.jks; git commit -m "Add the self-signed apk signing key (made on the runner, user request 2026-10-13)"; git push origin HEAD:main
