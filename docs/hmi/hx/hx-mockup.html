<title>LMYP HMI SHELL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* HX plant pages: every colour and font is a token. Layout: a page rail on the left, one page on the right with three views
   (Process, Controls, Trends). Light values first; the two dark blocks only redefine tokens. In the app: map these tokens to the
   theme of the app (README, step 4). */
:root {
  --hx-bg: #eef1f4;
  --hx-panel: #ffffff;
  --hx-panel2: #f6f8fa;
  --hx-ink: #17212b;
  --hx-ink2: #44525f;
  --hx-mute: #74808c;
  --hx-rule: #d3dae1;
  --hx-fill: #e9edf2;
  --hx-accent: #1f5fbf;
  --hx-on-accent: #ffffff;
  --hx-run: #d6312b;
  --hx-stop: #1c9a55;
  --hx-warn: #b96a00;
  --hx-warn-bg: #fff3dc;
  --hx-none: #9aa5b0;
  --hx-remote: #1f5fbf;
  --hx-level: #9cc6ea;
  /* media: none of them is the red / green of a state */
  --hx-m-steam: #7a52c7;
  --hx-m-reheat: #a8479a;
  --hx-m-water: #2a6fba;
  --hx-m-condensate: #2f9bd0;
  --hx-m-cooling: #178a8e;
  --hx-m-sea: #2b5f93;
  --hx-m-air: #6f8ba3;
  --hx-m-hotair: #b08355;
  --hx-m-gas: #86705f;
  --hx-m-oil: #8b5a2b;
  --hx-m-coal: #3c434b;
  --hx-m-solid: #a08f62;
  --hx-m-ash: #8b9199;
  --hx-m-lube: #7c8030;
  --hx-m-power: #17212b;
  --hx-m-drain: #8b97a3;
  --hx-m-signal: #8b97a3;
  --hx-pen1: #2a6fba;
  --hx-pen2: #a8479a;
  --hx-pen3: #b98212;
  --hx-pen4: #178a8e;
  --hx-pen5: #7a52c7;
  --hx-pen6: #55626f;
  --hx-font: 'IBM Plex Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --hx-cond: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --hx-mono: 'IBM Plex Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --hx-bg: #12161b;
    --hx-panel: #1a2027;
    --hx-panel2: #212831;
    --hx-ink: #e7ecf1;
    --hx-ink2: #b4bec9;
    --hx-mute: #8693a0;
    --hx-rule: #323c47;
    --hx-fill: #252d37;
    --hx-accent: #6aa5ff;
    --hx-on-accent: #0c1420;
    --hx-run: #ff5f58;
    --hx-stop: #38c97c;
    --hx-warn: #f2b23e;
    --hx-warn-bg: #3a2c10;
    --hx-none: #6b7783;
    --hx-remote: #6aa5ff;
    --hx-level: #2f5f8c;
    --hx-m-steam: #a98bf0;
    --hx-m-reheat: #dc86c0;
    --hx-m-water: #5aa2ee;
    --hx-m-condensate: #6cc0ee;
    --hx-m-cooling: #3fbfc3;
    --hx-m-sea: #6f9fd0;
    --hx-m-air: #9db4c8;
    --hx-m-hotair: #d0a57a;
    --hx-m-gas: #b39c8b;
    --hx-m-oil: #c48a55;
    --hx-m-coal: #a9b2bc;
    --hx-m-solid: #cdbd8c;
    --hx-m-ash: #a3aab2;
    --hx-m-lube: #b6ba5c;
    --hx-m-power: #e7ecf1;
    --hx-m-drain: #8693a0;
    --hx-m-signal: #8693a0;
    --hx-pen1: #5aa2ee;
    --hx-pen2: #dc86c0;
    --hx-pen3: #e0b04a;
    --hx-pen4: #3fbfc3;
    --hx-pen5: #a98bf0;
    --hx-pen6: #aab4bf;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --hx-bg: #12161b;
  --hx-panel: #1a2027;
  --hx-panel2: #212831;
  --hx-ink: #e7ecf1;
  --hx-ink2: #b4bec9;
  --hx-mute: #8693a0;
  --hx-rule: #323c47;
  --hx-fill: #252d37;
  --hx-accent: #6aa5ff;
  --hx-on-accent: #0c1420;
  --hx-run: #ff5f58;
  --hx-stop: #38c97c;
  --hx-warn: #f2b23e;
  --hx-warn-bg: #3a2c10;
  --hx-none: #6b7783;
  --hx-remote: #6aa5ff;
  --hx-level: #2f5f8c;
  --hx-m-steam: #a98bf0;
  --hx-m-reheat: #dc86c0;
  --hx-m-water: #5aa2ee;
  --hx-m-condensate: #6cc0ee;
  --hx-m-cooling: #3fbfc3;
  --hx-m-sea: #6f9fd0;
  --hx-m-air: #9db4c8;
  --hx-m-hotair: #d0a57a;
  --hx-m-gas: #b39c8b;
  --hx-m-oil: #c48a55;
  --hx-m-coal: #a9b2bc;
  --hx-m-solid: #cdbd8c;
  --hx-m-ash: #a3aab2;
  --hx-m-lube: #b6ba5c;
  --hx-m-power: #e7ecf1;
  --hx-m-drain: #8693a0;
  --hx-m-signal: #8693a0;
  --hx-pen1: #5aa2ee;
  --hx-pen2: #dc86c0;
  --hx-pen3: #e0b04a;
  --hx-pen4: #3fbfc3;
  --hx-pen5: #a98bf0;
  --hx-pen6: #aab4bf;
  color-scheme: dark;
}

.hx { font-family: var(--hx-font); color: var(--hx-ink); font-size: 14px; line-height: 1.4; }
.hx *, .hx *::before { box-sizing: border-box; }
.hx button { font: inherit; color: inherit; cursor: pointer; }
.hx button:focus-visible, .hx [tabindex]:focus-visible { outline: 2px solid var(--hx-accent); outline-offset: 2px; }

/* ---- shell: rail + page ---- */
.hx-shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 14px; align-items: start; }
.hx-nav { background: var(--hx-panel); border: 1px solid var(--hx-rule); border-radius: 10px; padding: 10px 8px; position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow: auto; }
.hx-nav h2 { font: 600 11px/1.2 var(--hx-cond); letter-spacing: 0.09em; text-transform: uppercase; color: var(--hx-mute); margin: 12px 8px 4px; }
.hx-nav h2:first-child { margin-top: 2px; }
.hx-nav button { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; font-size: 13.5px; }
.hx-nav button i { font: 500 10.5px var(--hx-mono); color: var(--hx-mute); font-style: normal; min-width: 16px; }
.hx-nav button:hover { background: var(--hx-panel2); }
.hx-nav button[aria-current='page'] { background: var(--hx-accent); color: var(--hx-on-accent); font-weight: 600; }
.hx-nav button[aria-current='page'] i { color: inherit; opacity: 0.8; }
.hx-pick { display: none; width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--hx-rule); background: var(--hx-panel); color: var(--hx-ink); font: 600 14px var(--hx-font); }
.hx-main { min-width: 0; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.hx-slot, .hx-page, .hx-view { min-width: 0; }

/* unit strip: the numbers an operator always wants */
.hx-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(106px, 1fr)); background: var(--hx-panel); border: 1px solid var(--hx-rule); border-radius: 10px; overflow: hidden; }
.hx-strip div { padding: 6px 10px 7px; min-width: 0; box-shadow: 1px 0 0 var(--hx-rule), 0 1px 0 var(--hx-rule); }
.hx-strip span { display: block; font: 500 11px/1.25 var(--hx-cond); letter-spacing: 0.03em; color: var(--hx-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hx-strip b { font: 600 17px/1.2 var(--hx-mono); font-variant-numeric: tabular-nums; }
.hx-strip small { font: 500 11px var(--hx-font); color: var(--hx-mute); margin-left: 3px; }

/* ---- one page ---- */
.hx-page { background: var(--hx-panel); border: 1px solid var(--hx-rule); border-radius: 10px; overflow: hidden; }
.hx-head { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--hx-rule); }
.hx-head h1 { font: 600 19px/1.15 var(--hx-cond); letter-spacing: 0.01em; margin: 0; }
.hx-head p { margin: 1px 0 0; font-size: 12.5px; color: var(--hx-mute); }
.hx-head > div:first-child { flex: 1 1 260px; min-width: 0; }
.hx-status { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; }
.hx-status span { padding: 2px 8px; border-radius: 99px; background: var(--hx-panel2); border: 1px solid var(--hx-rule); white-space: nowrap; }
.hx-status span.w { background: var(--hx-warn-bg); border-color: var(--hx-warn); color: var(--hx-warn); font-weight: 600; }
.hx-tabs { display: inline-flex; border: 1px solid var(--hx-rule); border-radius: 8px; overflow: hidden; }
.hx-tabs button { border: 0; background: var(--hx-panel); padding: 6px 14px; font-weight: 600; font-size: 13px; border-left: 1px solid var(--hx-rule); min-height: 34px; }
.hx-tabs button:first-child { border-left: 0; }
.hx-tabs button[aria-selected='true'] { background: var(--hx-ink); color: var(--hx-panel); }
.hx-view { padding: 6px 8px 8px; }
.hx-draw { overflow-x: auto; }
.hx-process svg { display: block; width: 100%; min-width: 860px; height: auto; }
.hx-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 6px 8px 2px; font-size: 12px; color: var(--hx-ink2); border-top: 1px solid var(--hx-rule); margin-top: 4px; }
.hx-legend span { display: inline-flex; align-items: center; gap: 6px; }
.hx-legend i { width: 22px; height: 4px; border-radius: 2px; display: inline-block; }
.hx-legend em { font-style: normal; color: var(--hx-mute); margin-left: auto; }

/* ---- process drawing (SVG) ---- */
.hx svg text { font-family: var(--hx-font); fill: var(--hx-ink); }
/* words stay readable where a line passes behind them */
.hx-process svg .hx-node text, .hx-process svg .hx-lane { paint-order: stroke; stroke: var(--hx-panel); stroke-width: 3.2px; stroke-linejoin: round; }
.hx-yn text, .hx-mode text { stroke: none !important; }
.hx-yn:not(.y):not(.n) { display: none; }
.hxo { fill: var(--hx-fill); stroke: var(--hx-ink); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.hxn { fill: none; stroke: var(--hx-ink); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.hxd { fill: none; stroke: var(--hx-ink2); stroke-width: 1.05; stroke-linejoin: round; stroke-linecap: round; }
.hxk { fill: var(--hx-ink); }
.hxs { fill: var(--hx-none); }
.hxs2 { stroke: var(--hx-none); }
.hxblade { stroke: var(--hx-ink); stroke-width: 2.4; stroke-linecap: round; fill: none; }
.hxbed { fill: var(--hx-m-solid); }
.hxlv { fill: var(--hx-level); }
.hxflame { opacity: 0; }
.hx-run .hxs { fill: var(--hx-run); }
.hx-run .hxs2 { stroke: var(--hx-run); }
.hx-run .hxflame { opacity: 1; }
.hx-stop .hxs { fill: var(--hx-stop); }
.hx-stop .hxs2 { stroke: var(--hx-stop); }
.hx-trip .hxs { fill: var(--hx-run); animation: hx-blink 1s steps(2) infinite; }
.hxr { transform-box: fill-box; transform-origin: center; }
.hx-run .hxr { animation: hx-spin 1.6s linear infinite; }
.hx-run .hxr.hxslow { animation-duration: 9s; }
@keyframes hx-spin { to { transform: rotate(360deg); } }
@keyframes hx-blink { 50% { opacity: 0.25; } }
@keyframes hx-flow { to { stroke-dashoffset: -32; } }
.hx-ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.hx-lnf { fill: none; stroke: var(--hx-panel); stroke-width: 1.4; stroke-dasharray: 3 13; stroke-linecap: round; opacity: 0; }
.hx-on > .hx-lnf { opacity: 0.95; animation: hx-flow 1.1s linear infinite; }
.hx-idle > .hx-ln { opacity: 0.42; }
.hx-name { font-size: 12.6px; font-weight: 600; }
.hx-tag { font: 500 9.6px var(--hx-mono); fill: var(--hx-mute) !important; }
.hx-lab { font-size: 11.4px; fill: var(--hx-ink2) !important; }
.hx-val { font: 600 12.6px var(--hx-mono); font-variant-numeric: tabular-nums; }
.hx-unit { font: 400 10.4px var(--hx-font); fill: var(--hx-mute) !important; }
.hx-st { font-size: 11.4px; font-weight: 600; }
.hx-st.run { fill: var(--hx-run) !important; }
.hx-st.stop { fill: var(--hx-stop) !important; }
.hx-st.none { fill: var(--hx-none) !important; }
.hx-st.trip { fill: var(--hx-run) !important; animation: hx-blink 1s steps(2) infinite; }
.hx-mode rect { fill: var(--hx-panel); stroke: var(--hx-ink2); stroke-width: 1; }
.hx-mode text { font: 600 10.4px var(--hx-font); fill: var(--hx-ink2) !important; }
.hx-mode.man rect { fill: var(--hx-warn-bg); stroke: var(--hx-warn); }
.hx-mode.man text { fill: var(--hx-warn) !important; }
.hx-mode.rem rect { stroke: var(--hx-remote); }
.hx-mode.rem text { fill: var(--hx-remote) !important; }
.hx-arw { stroke: none; }
.hx-idle > .hx-arw { opacity: 0.42; }
.hx-sig { fill: none; stroke: var(--hx-mute); stroke-width: 1.1; stroke-dasharray: 4 3; }
.hx-dot { fill: var(--hx-ink); stroke: var(--hx-panel); stroke-width: 1.2; }
.hx-end { font: 500 10.4px var(--hx-font); fill: var(--hx-mute) !important; paint-order: stroke; stroke: var(--hx-panel); stroke-width: 3px; }
.hx-tap { cursor: pointer; }
.hx-tap:hover .hx-dot, .hx-tap:focus-visible .hx-dot { fill: var(--hx-accent); }
.hx-zone { font: 600 10.5px var(--hx-cond); letter-spacing: 0.1em; text-transform: uppercase; fill: var(--hx-mute) !important; }
.hx-node { cursor: default; outline: none; }
.hx-link { outline: none; }
.hx-link:focus-visible rect { stroke: var(--hx-accent); stroke-width: 2.4; }
.hx-node[data-open] { cursor: pointer; }
.hx-node[data-open]:hover .hxo, .hx-node[data-open]:focus-visible .hxo { stroke: var(--hx-accent); stroke-width: 2.4; }
.hx-hit { fill: transparent; }
.hx-yn rect { stroke: var(--hx-ink); stroke-width: 1; }
.hx-yn text { font: 700 9.5px var(--hx-font); fill: #fff !important; }
.hx-yn.y rect { fill: var(--hx-run); }
.hx-yn.n rect { fill: var(--hx-stop); }
.hx-yn { cursor: pointer; }
.hx-link rect { fill: var(--hx-panel2); stroke: var(--hx-rule); stroke-width: 1.2; }
.hx-link text { font-size: 11.6px; font-weight: 600; fill: var(--hx-accent) !important; }
.hx-link { cursor: pointer; }
.hx-link:hover rect { stroke: var(--hx-accent); }
.hx-lane { font: 600 10.5px var(--hx-cond); letter-spacing: 0.1em; text-transform: uppercase; fill: var(--hx-mute) !important; }
.hx-note { font-size: 11px; fill: var(--hx-mute) !important; }

/* status lists (permissives, trips): Y = red = true, N = green */
.hx-lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; padding: 8px 6px 4px; }
.hx-lists > div { border: 1px solid var(--hx-rule); border-radius: 8px; padding: 8px 10px; }
.hx-lists h3 { font: 600 13px var(--hx-font); margin: 0; }
.hx-lists small { font: 500 10.5px var(--hx-mono); color: var(--hx-mute); }
.hx-lists p { display: flex; gap: 8px; align-items: center; margin: 4px 0 0; font-size: 12.5px; }
.hx-lists p .hx-ynb { width: 18px; height: 18px; flex: none; }

/* ---- controls view ---- */
.hx-sec { font: 600 11.5px/1.2 var(--hx-cond); letter-spacing: 0.09em; text-transform: uppercase; color: var(--hx-mute); margin: 12px 6px 6px; }
.hx-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 8px; padding: 0 4px; }
.hx-card { text-align: left; border: 1px solid var(--hx-rule); background: var(--hx-panel); border-radius: 8px; padding: 9px 11px 10px; display: grid; gap: 5px; min-width: 0; }
.hx-card:hover { border-color: var(--hx-accent); }
.hx-card .t { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.hx-card .t b { font-size: 13.4px; line-height: 1.25; }
.hx-card .g { font: 500 10.5px var(--hx-mono); color: var(--hx-mute); }
.hx-pill { font: 600 11px var(--hx-font); padding: 1px 8px; border-radius: 99px; border: 1px solid var(--hx-ink2); color: var(--hx-ink2); white-space: nowrap; }
.hx-pill.man { background: var(--hx-warn-bg); border-color: var(--hx-warn); color: var(--hx-warn); }
.hx-pill.rem { border-color: var(--hx-remote); color: var(--hx-remote); }
.hx-pill.run { border-color: var(--hx-run); color: var(--hx-run); }
.hx-pill.stop { border-color: var(--hx-stop); color: var(--hx-stop); }
.hx-pill.trip { background: var(--hx-run); border-color: var(--hx-run); color: #fff; }
.hx-row { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--hx-ink2); }
.hx-row b { font: 600 13px var(--hx-mono); color: var(--hx-ink); font-variant-numeric: tabular-nums; }
.hx-bar { height: 6px; border-radius: 3px; background: var(--hx-fill); position: relative; overflow: hidden; }
.hx-bar i { position: absolute; inset: 0 auto 0 0; background: var(--hx-ink2); border-radius: 3px; }
.hx-bar.pv i { background: var(--hx-accent); }
.hx-foot { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--hx-mute); }
.hx-ynb { font: 700 10.5px var(--hx-font); width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--hx-ink); color: #fff; display: inline-grid; place-items: center; }
.hx .hx-ynb { color: #fff; }
.hx .hx-ynb:not(.y):not(.n) { background: var(--hx-none); }
.hx-ynb.y { background: var(--hx-run); }
.hx-ynb.n { background: var(--hx-stop); }

/* ---- trends view ---- */
.hx-span { display: flex; gap: 6px; align-items: center; padding: 6px 6px 0; font-size: 12.5px; color: var(--hx-mute); }
.hx-span button { border: 1px solid var(--hx-rule); background: var(--hx-panel); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; min-height: 28px; }
.hx-span button[aria-pressed='true'] { background: var(--hx-ink); color: var(--hx-panel); border-color: var(--hx-ink); }
.hx-trend { border: 1px solid var(--hx-rule); border-radius: 8px; margin: 8px 4px 0; padding: 8px 10px 10px; }
.hx-trend h3 { font: 600 13.5px var(--hx-font); margin: 0 0 4px; }
.hx-trend svg { display: block; width: 100%; height: 170px; }
.hx-grid { stroke: var(--hx-rule); stroke-width: 1; }
.hx-axis { font: 500 10px var(--hx-mono); fill: var(--hx-mute) !important; }
.hx-pens { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 14px; margin-top: 6px; font-size: 12px; }
.hx-pens div { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: baseline; min-width: 0; }
.hx-pens i { width: 12px; height: 3px; border-radius: 2px; align-self: center; }
.hx-pens b { font: 600 12.5px var(--hx-mono); font-variant-numeric: tabular-nums; }
.hx-pens small { color: var(--hx-mute); font-size: 10.5px; }

@media (max-width: 1100px) {
  .hx-shell { grid-template-columns: minmax(0, 1fr); }
  .hx-nav { display: none; }
  .hx-pick { display: block; }
}
@media (prefers-reduced-motion: reduce) {
  .hx-run .hxr, .hx-on > .hx-lnf, .hx-trip .hxs, .hx-st.trip { animation: none; }
}

<template id="doc"><div class="doc"><h2>HX plant pages: handoff for the next coder</h2>
<p>Made 2026-11-16 on the order of the user: "gawan ng mga HMI pages ... lahat ng planta macocover pati operator controls at trend", "BE ORIGINAL WALA KA DAPAT GAGAYAHIN", "hmi shell lang ... no need to integrate sa app, pero dapat retrofit ready", "babase ka lang sa available data".</p>
<h3>1. What this is</h3>
<ul>
<li>A <b>mockup of a new HMI shell</b>: 23 pages for the whole plant, each with three views: <b>Process</b> (the drawing), <b>Controls</b> (every loop, machine and on / off valve of the page) and <b>Trends</b> (pen groups).</li>
<li>It is <b>not in the app</b>. Nothing under <code>src/</code> or <code>dist/</code> was changed. The app build does not read this folder.</li>
<li>It is <b>retrofit ready</b>: the pages never touch the simulator. Every number, state and click goes through one object, <code>HX.data</code>. The mockup fills it with sample data; the app fills it with the real signals (section 5).</li>
<li>The design is original: it copies neither the control room screens, nor the 19 temporary pages, nor another DCS. Only the CONTENT (which machine, which tag, which loop) comes from the app.</li>
<li>At hand-over: 23 pages; all 63 control loops and all 168 machines and valves of the registry are on a page; 190 of its 401 value keys are used (the rest are second and third transmitters of the same point). <code>tools/build.mjs</code> prints this line again.</li>
</ul>
<h3>2. Files (all in <code>docs/hmi/hx/</code>)</h3>
<ul>
<li><code>hx.css</code>: every colour and font as a token (light and dark).</li>
<li><code>hx-sym.js</code>: the symbol set (pump, fan, valve, damper, drum, heater, furnace, cyclone, turbine ...). One drawing per kind of equipment.</li>
<li><code>hx-core.js</code>: the engine. Lays a page out, draws it, keeps it live, records trends. Knows nothing about the simulator.</li>
<li><code>hx-pages.js</code>: the 23 pages as short descriptions. This is the file to edit for content.</li>
<li><code>hx-registry.js</code>: GENERATED. Every machine, valve and loop that the app binds today on its temporary pages (name, English text, DITL sheet or controller tag, source page and id) and one set of values = what the app showed at "Start at 150 MW" (3.2.3-beta.272).</li>
<li><code>hx-sample.js</code>: the sample adapter of the mockup (answers <code>HX.data</code> from the registry, opens a sample faceplate). Replaced in the app.</li>
<li><code>hx-mockup.html</code>: GENERATED one-file mockup (this is what the artifact shows).</li>
<li><code>tools/build.mjs</code>: checks the pages and builds <code>hx-mockup.html</code>.</li>
<li><code>tools/dump-live150.js</code>, <code>tools/make-registry.py</code>, <code>tools/summary.json</code>, <code>tools/live150.json</code>: how the registry was made.</li>
</ul>
<h3>3. How to see it and how to check it</h3>
<pre><code>node docs/hmi/hx/tools/build.mjs</code></pre>
<ul>
<li>Prints the coverage line and stops with exit 1 when a page names a tag, machine, loop or valve that is not in the registry.</li>
<li>Writes <code>hx-mockup.html</code>. Open it in a browser, or publish it as an artifact (the file is already in artifact form: no doctype, title at the top).</li>
<li>The engine also warns in the browser console when a page link or a join names something that does not exist.</li>
</ul>
<h3>4. Design rules (keep them when you add pages)</h3>
<ol>
<li>A page reads left to right, one stream per lane. The medium gives the colour of the line; no medium uses the red or green of a state.</li>
<li>RUN / OPEN = red, STOP / CLOSED = green, TRIP = blinking red, no signal = grey and <code>-----</code>. Y = red = permissive complete, N = green.</li>
<li>Words first: plain English name in bold, the tag small under it. No acronym as a label. Units on every number.</li>
<li>Manual mode is the one that stands out (amber pill). Auto is quiet. Remote is blue.</li>
<li>Only meaningful motion: a rotor turns while its machine runs, dashes move on a line while it flows. <code>prefers-reduced-motion</code> stops both.</li>
<li>Two faceplates per equipment: a click on the equipment = CONTROL; the small Y / N square = PERMISSIVE, TREND, MONITOR.</li>
<li>The size of the text never changes: the drawing is 1280 units wide. A page with many rows grows downwards.</li>
<li>No value is typed into a page. A page names a key; the adapter gives the number. No source = <code>-----</code>.</li>
</ol>
<h3>5. Putting it in the app (the retrofit)</h3>
<p>The work is ONE new file, the real adapter. <code>hx-core.js</code>, <code>hx-sym.js</code>, <code>hx-pages.js</code> and <code>hx.css</code> go in unchanged.</p>
<h4>5.1 The contract</h4>
<pre><code>HX.data = {
  time()                 // seconds of simulation time (trend x axis)
  value(key)             // number or null. key = the tag exactly as the app pages use it in data-v,
                         //   or 'SHEET|ADDRESS' (for example 'ABC-002|SI0060')
  machine(name)          // { st: 'run' | 'stop' | 'trip' | null, mode: 'Remote · Auto' | null, perm: true | false | null }
  loop(tag)              // { pv, sv, mv, mode: 'AUTO' | 'MANUAL' | 'REMOTE', unit } or null
  valve(tag)             // { pct, open, mode }
  flag(key)              // true | false | null, for the Y / N lists. key = 'DITL-01|row text'
  open(kind, id, second) // kind 'mach' | 'loop' | 'valve'; second = true -&gt; the Y / N faceplate
}</code></pre>
<p><code>HX.mount(element, pageId, { go: id =&gt; ..., noTimer: true })</code> returns <code>{ tick, show, destroy }</code>. In the app call <code>tick()</code> from the refresh of the plant page instead of the 1 s timer, and <code>destroy()</code> when the page closes. <code>HX.shell</code> is only the frame of the mockup: the app has its own frame (layout C).</p>
<h4>5.2 Where the real signals are</h4>
<p>Every entry of <code>HXREG.machines</code> carries <code>page</code> and <code>id</code> (for example <code>BFWP-A</code>: page <code>MK06</code>, id <code>PA</code>) and <code>bind</code> = the same fields the temporary page uses (<code>ad</code> DITL sheet or address, <code>mov</code>, <code>tcs</code>, <code>io</code>, <code>cur</code> ...). So the adapter can ask the runtime of the temporary pages (<code>src/ui/plant/hmi-mock.js</code>) for exactly the value it already shows:</p>
<ul>
<li>value of a tag (<code>data-v</code>): the logic transmitter when a sheet has it, else the plant model key of <code>def.unit</code>.</li>
<li>machine state: <code>LS_DOCK.mst</code>, mode: <code>LS_DOCK.modeOf</code>.</li>
<li>controller PV / SV / MV / mode: <code>LS_LIVE.pvOf</code>, <code>svOf</code>, <code>mvOf</code>, <code>modeOf</code>.</li>
<li>MOV / XV position: the <code>data-mov</code> hook (<code>pct</code>, <code>oc</code>, <code>md</code>).</li>
<li>faceplates: <code>LS_FPOP.hit</code>, <code>LS_FPOP.motor</code>, <code>LS_FPOP.mov</code>, <code>LS_FPOP.valve</code>, <code>LS_FPOP.tcs</code>, the Y / N one <code>LS_FPOP.yn</code>; controllers: <code>fpOpen</code> of <code>src/ui/plant/plant.js</code>.</li>
</ul>
<p>These names are read from the head comment of <code>hmi-mock.js</code> and from the live objects of the app (3.2.3-beta.272). <b>The arguments of each call were NOT read by this thread</b> (the helper agents ran out of quota): read them in <code>hmi-mock.js</code>, <code>fp-pop.js</code> and <code>src/ui/training/live.js</code> before writing the adapter. The cleanest way is to make <code>hmi-mock.js</code> export its own resolvers and call those, so HX and the temporary pages can never show two different numbers.</p>
<h4>5.3 Steps</h4>
<ol>
<li>Copy the 4 source files into <code>src/ui/plant/</code> and add them to the script list the build reads (<code>src/index.template.html</code>, the <code>@@LIST</code> files). Add the two generated dark blocks of <code>hx.css</code> to the theme switch of the app (the app does not use <code>data-theme</code> / <code>prefers-color-scheme</code> the same way: map the <code>--hx-*</code> tokens there).</li>

<li>Fonts: set <code>--hx-font</code>, <code>--hx-cond</code>, <code>--hx-mono</code> to the fonts the app already embeds (IBM Plex Sans, IBM Plex Sans Condensed, IBM Plex Mono are in <code>src/ui/fonts</code>).</li>
<li>Trend recorder: <code>HX.rec</code> samples every 2 s of <code>HX.data.time()</code> and keeps 2 h. It must be sampled while the page is closed too: call <code>HX.rec.sample()</code> from the simulation tick (also in Worker mode), and <code>HX.rec.watch(key)</code> for the pens of all pages at start.</li>
<li>Y / N lists (<code>def.lists</code>, page 03): map each row text to its DITL row in <code>flag(key)</code>.</li>
<li>Keep the 19 temporary pages until the user says otherwise: they are the pages of the loop check.</li>
<li>Rules of the repo still hold: version bump, <code>npm run build</code>, <code>npm run check</code>, screenshots of the real app, <code>HANDOFF.md</code>, no merge without the GO of the user.</li>
