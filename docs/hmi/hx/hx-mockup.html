<h3>6. How to add or change a page</h3>
<p>Edit <code>hx-pages.js</code>. A page is lanes; a lane is one stream; an array inside a lane is equipment in parallel.</p>
<pre><code>page({
  id: 'feedwater', group: 'Water and steam', title: 'Feedwater', about: 'one sentence',
  lanes: [
    { med: 'water', label: 'Feedwater', items: [
      E('deaerator', 'Deaerator', 'T-1104', [V('Level', 'LT-CD1104-1', 'mm', 0)]),
      [M('pump', 'BFWP-A', 'Boiler feed pump A', [V('Current', 'IT-P1115A', 'A')]),
       M('pump', 'BFWP-B', 'Boiler feed pump B', [V('Current', 'IT-P1115B', 'A')])],
      C('FICFW1007', 'Main feedwater valve', { pv: 't/h' }),
      L('drum-steam', 'To economizer')
    ] }
  ],
  loops: [['LICBR1001', 'Drum level, three element']],   // on the Controls view only
  trends: [{ title: 'Drum level', pens: [['Drum level', 'pv:LICBR1001B', 'mm', 0]] }]
});</code></pre>
<ul>
<li><code>E(symbol, name, tag, values, options)</code> equipment that is not operated. <code>M(symbol, machine, name, values, options)</code> a machine of the registry. <code>C(loop, name, options)</code> a control valve (or <code>sym: 'damper'</code>, <code>sym: 'block'</code>) with its loop. <code>X(valve, name)</code> an on / off valve. <code>L(pageId, text)</code> a link. <code>V(label, key, unit, decimals)</code> a value; key <code>pv:TAG</code>, <code>sv:TAG</code>, <code>mv:TAG</code> reads a loop.</li>
<li>Lane options: <code>med</code> (medium), <code>label</code>, <code>flow</code> (when the dashes move: <code>m:MACHINE</code>, <code>x:VALVE</code>, <code>l:LOOP</code>, <code>v:KEY&gt;n</code>, <code>a|b</code>), <code>noline</code> (a row of items with no line), <code>rev</code> (right to left), <code>cut: [i]</code> (no line after column i).</li>
<li>Item options: <code>id</code> (for joins), <code>at</code> (x position 0 to 100), <code>lab: 'r' | 'l'</code> (words beside the symbol), <code>w</code>, <code>h</code>, <code>r</code> (size), <code>tag</code>, <code>go</code> (click opens a page), <code>on</code> (state colour from a flow rule), <code>level: [key, low, high]</code>, <code>pin</code> / <code>pout</code> (which port the lane line uses).</li>
<li><code>joins: [{ from: 'id.port', to: 'id.port', med, via: 'h' | 'v' | 'hv' | 'vh', mid, flow }]</code> for a line between lanes.</li>
<li>New kind of equipment: add one function to <code>hx-sym.js</code> (drawn around 0, 0; returns <code>svg</code>, <code>ports</code>, <code>box</code>).</li>
<li>New machine or tag in the app: run <code>tools/dump-live150.js</code> on the built app, then <code>tools/make-registry.py</code>.</li>
</ul>
<h3>6b. A page as a plan (the full operator drawing)</h3>
<p>The user did not accept the first 23 pages as operator graphics (2026-11-17): only the main line had pipes; spray valves, drains and vents stood in a row with no line. <code>hx-page-reheat.js</code> is the sample of the answer: a page drawn as a <b>plan</b>, where every valve, spray, drain pot and transmitter sits on its own line. New pages should be made this way; the lane pages are a summary level only.</p>
<ul>
<li><code>plan: { h, items, pipes, taps, texts, signals }</code> instead of <code>lanes</code>.</li>
<li><code>items</code>: the same <code>E</code>, <code>M</code>, <code>C</code>, <code>X</code>, <code>L</code> with <code>x</code>, <code>y</code> (the drawing is 1280 wide, <code>h</code> high). <code>rot: -90</code> or <code>90</code> turns a valve onto a vertical line (with -90 the actuator points left; port <code>r</code> is then the top end and <code>l</code> the bottom end). <code>lab: 't' | 'b' | 'l' | 'r'</code> = where the words go. <code>cname</code> = the longer name used on the Controls view.</li>
<li><code>pipes</code>: <code>{ med, w, flow, pts, to, arrow }</code>. A point is <code>'id.port'</code> or <code>[x, y]</code>; <code>null</code> keeps the x or y of the point before. Two points not in line get a right-angle bend. <code>to: 'flash chamber'</code> ends the pipe with an arrow and that word.</li>
<li><code>taps</code>: a transmitter on its line: <code>{ x, y, side, label, key, key2, unit, dp, tag }</code> (<code>key2</code> shows two transmitters as <code>a / b</code>).</li>
<li><code>signals</code>: thin dashed control signal between items. <code>texts</code>: free words (<code>cls: 'hx-name' | 'hx-zone' | 'hx-note'</code>).</li>
<li>An item of the flow diagram that the app does not bind yet is drawn with <code>E</code> (grey, tag shown), never left out and never given an invented signal.</li>
<li>Method that was used for the reheat page, to repeat for every page: (1) read the flow diagram sheet(s) of the system and write down the order of every item along every line; (2) list what the control room page of that system shows (content only); (3) take the tags the app binds from <code>hx-registry.js</code>; (4) place and connect; (5) run a check for words over words, pipes and symbols (0 allowed); (6) have someone who did not draw it compare the page with the flow diagram, connection by connection.</li>
<li>Flow diagrams: private repo <code>Ronanski/icms-plant-documents</code>, <code>flow-diagram-K1AU3-A1-0-001.zip</code>: use the RB file (Rev D) when the sheet is in it. Drawing list on page 2 ~ 4 of each PDF. Reheat = <code>K1AU3-PD-012</code>, main steam = <code>K1AU3-PD-011</code>.</li>
</ul>
<h3>7. What is real and what is sample</h3>
<ul>
<li>Real (from the app): the tags, machine names, loop tags, DITL sheets, English names of the registry; the 150 MW values; the running / stopped states; the rows of the purge and trip lists (text of temporary page 10).</li>
<li>Sample only: the slow ripple on the values, the 2 h of trend history, permissive = Y on every machine, Y on every list row, the sample faceplate.</li>
<li>Trend scale: automatic (shown beside each pen). In the app use the instrument range of the I/O list instead (give <code>low</code>, <code>high</code> as the 5th and 6th item of a pen).</li>
<li>Level picture of a vessel: only where the transmitter is in percent (limestone and sand silo). The others need the instrument range.</li>
</ul>
<h3>8. Not done, not checked</h3>
<ul>
<li>Not in the app, so NOT tested with the real engine, Worker mode, save points or the loop check dock.</li>
<li>The pages hold only what the 19 temporary pages bind. Not drawn because no binding is in the registry: secondary air wall dampers and the single bed thermocouples, shaft monitor detail, fly ash handling, bottom ash conveyors detail, electrical auxiliaries.</li>
<li>Values the app itself shows as <code>-----</code> (no source) are <code>-----</code> here too.</li>
<li><code>GEN.VF</code> and <code>GEN.IF</code> have no unit in the app page; none is shown here.</li>
<li>The P&amp;ID and the control room snapshots were not re-read for this mockup (user: use the available data). Before coding a page into the app, check its flow against the P&amp;ID as COMMANDMENT 1 says.</li>
<li>Checked by this thread: <code>tools/build.mjs</code> passes (no unknown name), all 23 pages drawn in a headless browser at 1440 x 900 with 0 overlapping words, light and dark, 1024 and 400 px wide, 0 page errors.</li>
</ul></div></template>
<script>
/* HX: the plant pages of 3.2.3 (user 2026-11-16: "gawan ng mga HMI pages ... lahat ng planta macocover pati operator controls at
   trend", "BE ORIGINAL WALA KA DAPAT GAGAYAHIN"). This file is the SYMBOL SET of those pages: one drawing per kind of equipment, made
   for this app (not taken from the control room screens, the old pages or another DCS). Every symbol is drawn around (0, 0) and gives
   back { svg, ports, box }: ports are the points where a line may join it, box = [x0, y0, x1, y1] is the room it takes.
   Classes (hx.css): hxo = body (outline + fill), hxn = outline only, hxd = thin detail, hxk = solid ink, hxs = the part that takes the
   state colour (RUN / OPEN red, STOP / CLOSED green, TRIP blinking red, no signal grey), hxr = the part that turns while running,
   hxlv = the liquid of a vessel (the page sets its height from the level). No colour is written here: the theme does that. */
(function () {
  const n = x => String(Math.round(x * 10) / 10);
  const P = (...a) => a.map(n).join(' ');
  /* petals of a rotor: k blades of radius R, swept */
  const rotor = (k, R) => {
    let s = '';
    for (let i = 0; i < k; i++)
      s += `<path class="hxs" transform="rotate(${n((360 / k) * i)})" d="M0 0Q${P(R * 0.15, -R * 0.95)} ${P(R * 0.8, -R * 0.62)}Q${P(R * 0.42, -R * 0.12)} 0 0Z"/>`;
    return `<g class="hxr">${s}</g>`;
  };
  const capsule = (w, h) =>
    `M${P(-w / 2 + h / 2, -h / 2)}H${n(w / 2 - h / 2)}A${P(h / 2, h / 2)} 0 0 1 ${P(w / 2 - h / 2, h / 2)}H${n(-w / 2 + h / 2)}A${P(h / 2, h / 2)} 0 0 1 ${P(-w / 2 + h / 2, -h / 2)}Z`;
  const vcapsule = (w, h) =>
    `M${P(-w / 2, -h / 2 + w / 2)}A${P(w / 2, w / 2)} 0 0 1 ${P(w / 2, -h / 2 + w / 2)}V${n(h / 2 - w / 2)}A${P(w / 2, w / 2)} 0 0 1 ${P(-w / 2, h / 2 - w / 2)}Z`;
  const rrect = (w, h, r) =>
    `<rect class="hxo" x="${n(-w / 2)}" y="${n(-h / 2)}" width="${n(w)}" height="${n(h)}" rx="${n(r)}"/>`;
  const zig = (x0, x1, y, a, k) => {
    let d = `M${P(x0, y)}`;
    const st = (x1 - x0) / k;
    for (let i = 0; i < k; i++) d += `L${P(x0 + st * (i + 0.5), y + (i % 2 ? a : -a))}`;
    return d + `L${P(x1, y)}`;
  };
  const ports4 = (w, h) => ({ l: [-w / 2, 0], r: [w / 2, 0], t: [0, -h / 2], b: [0, h / 2] });
  /* a level: the liquid is a rect clipped by the vessel; the page moves rect[data-lv] (y, height) between y1 (empty) and y0 (full) */
  const level = (id, shape, x0, y0, x1, y1) =>
    `<clipPath id="hxc-${id}"><path d="${shape}"/></clipPath><rect class="hxlv" data-lv="${n(y0)},${n(y1)}" clip-path="url(#hxc-${id})" x="${n(x0)}" y="${n(y1)}" width="${n(x1 - x0)}" height="0"/>`;
  const S = {};

  /* ---- machines that turn ---- */
  S.pump = o => {
    const r = o.r || 16;
    return {
      box: [-r - 2, -r - 2, r + 2, r + 7],
      ports: { l: [-r, 0], r: [r, 0], t: [0, -r], b: [0, r] },
      svg:
        `<path class="hxn" d="M${P(-r * 0.75, r + 5)}H${n(r * 0.75)}M${P(-r * 0.5, r * 0.86)}L${P(-r * 0.75, r + 5)}M${P(r * 0.5, r * 0.86)}L${P(r * 0.75, r + 5)}"/>` +
        `<circle class="hxo" r="${r}"/>${rotor(3, r * 0.72)}<circle class="hxk" r="2"/>`
    };
  };
  S.fan = o => {
    const r = o.r || 20;
    let bl = '';
    for (let i = 0; i < 8; i++)
      bl += `<path class="hxs" transform="rotate(${i * 45})" d="M${P(-2, -r * 0.3)}L${P(-3.2, -r * 0.8)}H${n(3.2)}L${P(2, -r * 0.3)}Z"/>`;
    return {
      box: [-r - 2, -r - 2, r + 12, r + 2],
      ports: { l: [-r, 0], r: [r + 10, 0], t: [0, -r], b: [0, r] },
      svg: `<path class="hxo" d="M${P(r * 0.7, -r * 0.5)}L${P(r + 10, -r * 0.42)}V${n(r * 0.42)}L${P(r * 0.7, r * 0.5)}Z"/><circle class="hxo" r="${r}"/><g class="hxr">${bl}</g><circle class="hxo" r="${n(r * 0.24)}"/>`
    };
  };
  S.blower = o => {
    const r = o.r || 15;
    return {
      box: [-r * 1.5 - 2, -r - 2, r * 1.5 + 2, r + 2],
      ports: { l: [-r * 1.5, 0], r: [r * 1.5, 0], t: [0, -r], b: [0, r] },
      svg:
        `<path class="hxo" d="${capsule(r * 3, r * 2)}"/>` +
        `<g transform="translate(${n(-r * 0.5)} 0)"><g class="hxr"><path class="hxs" d="${capsule(r * 1.5, r * 0.62)}"/></g></g>` +
        `<g transform="translate(${n(r * 0.5)} 0)"><g class="hxr"><path class="hxs" transform="rotate(90)" d="${capsule(r * 1.5, r * 0.62)}"/></g></g>`
    };
  };
  S.compressor = o => {
    const r = o.r || 17;
    return {
      box: [-r - 2, -r - 2, r + 2, r + 2],
      ports: { l: [-r, 0], r: [r, 0], t: [0, -r], b: [0, r] },
      svg: `<circle class="hxo" r="${r}"/><path class="hxs" d="M${P(-r * 0.72, -r * 0.62)}L${P(r * 0.82, -r * 0.22)}V${n(r * 0.22)}L${P(-r * 0.72, r * 0.62)}Z"/>`
    };
  };
  /* a motor alone (agitator, rotary valve, drive of a conveyor) */
  S.motor = o => {
    const w = o.w || 30,
      h = o.h || 20;
    return {
      box: [-w / 2 - 6, -h / 2 - 2, w / 2 + 2, h / 2 + 2],
      ports: ports4(w, h),
      svg:
        `<path class="hxn" d="M${P(-w / 2 - 6, 0)}H${n(-w / 2)}"/>${rrect(w, h, 4)}` +
        `<rect class="hxs" x="${n(-w / 2 + 5)}" y="${n(-h / 2 + 5)}" width="${n(w - 10)}" height="${n(h - 10)}" rx="2"/>`
    };
  };

  /* ---- valves and dampers ---- */
  const bow = (w, h) => `M${P(-w / 2, -h / 2)}L0 0L${P(-w / 2, h / 2)}ZM${P(w / 2, -h / 2)}L0 0L${P(w / 2, h / 2)}Z`;
  S.valve = o => {
    const w = 24,
      h = 15,
      k = o.kind || 'manual';
    let top = '',
      ty = -h / 2;
    if (k === 'control') {
      top = `<path class="hxn" d="M0 0V-13"/><path class="hxo" d="M-9 -13A9 8 0 0 1 9 -13Z"/>`;
      ty = -21;
    } else if (k === 'motor') {
      top = `<path class="hxn" d="M0 0V-10"/><rect class="hxo" x="-7.5" y="-24" width="15" height="14" rx="2"/><circle class="hxd" cy="-17" r="3.6"/>`;
      ty = -24;
    } else if (k === 'shutoff') {
      top = `<path class="hxn" d="M0 0V-10"/><rect class="hxo" x="-7" y="-22" width="14" height="12" rx="1"/><path class="hxd" d="M-7 -10L7 -22"/>`;
      ty = -22;
    } else if (k === 'manual') {
      top = `<path class="hxn" d="M0 0V-10M-7 -10H7"/>`;
      ty = -11;
    } else if (k === 'safety') {
      top = `<path class="hxn" d="M0 0L0 -5L4 -7L-4 -11L4 -15L-4 -19L0 -21"/>`;
      ty = -22;
    }
    const body =
      k === 'check'
        ? `<path class="hxo" d="${bow(w, h)}"/><path class="hxk" d="M${P(w / 2, -h / 2)}L0 0L${P(w / 2, h / 2)}Z"/>`
        : `<path class="hxo hxs" d="${bow(w, h)}"/>`;
    return {
      box: [-w / 2 - 1, ty - 1, w / 2 + 1, h / 2 + 1],
      ports: { l: [-w / 2, 0], r: [w / 2, 0], t: [0, ty], b: [0, h / 2] },
      svg: top + body
    };
  };
  /* damper: a piece of duct with blades; the page turns g[data-bl] by the position (0 % = shut = blades across the flow) */
  S.damper = o => {
    const w = 26,
      h = o.h || 22,
      k = o.kind || 'control';
    let bl = '';
    for (const y of [-h / 4, h / 4])
      bl += `<g transform="translate(0 ${n(y)})"><path class="hxblade" data-bl="1" d="M0 ${n(-h / 4 + 1)}V${n(h / 4 - 1)}"/></g>`;
    const top =
      k === 'none'
        ? ''
        : `<path class="hxn" d="M0 ${n(-h / 2)}V${n(-h / 2 - 7)}"/>` +
          (k === 'motor'
            ? `<rect class="hxo" x="-7" y="${n(-h / 2 - 20)}" width="14" height="13" rx="2"/><circle class="hxd" cy="${n(-h / 2 - 13.5)}" r="3.4"/>`
            : `<path class="hxo" d="M-8 ${n(-h / 2 - 7)}A8 7 0 0 1 8 ${n(-h / 2 - 7)}Z"/>`);
    const ty = k === 'none' ? -h / 2 : k === 'motor' ? -h / 2 - 20 : -h / 2 - 14;
    return {
      box: [-w / 2 - 1, ty - 1, w / 2 + 1, h / 2 + 1],
      ports: { l: [-w / 2, 0], r: [w / 2, 0], t: [0, ty], b: [0, h / 2] },
      svg:
        top +
        `<rect class="hxo" x="${n(-w / 2)}" y="${n(-h / 2)}" width="${w}" height="${n(h)}" rx="2"/><g class="hxbl">${bl}</g>`
    };
  };

  /* ---- vessels ---- */
  S.tank = o => {
    const w = o.w || 70,
      h = o.h || 90,
      r = Math.min(10, w / 5),
      sh = `M${P(-w / 2, -h / 2 + r)}A${P(r, r)} 0 0 1 ${P(-w / 2 + r, -h / 2)}H${n(w / 2 - r)}A${P(r, r)} 0 0 1 ${P(w / 2, -h / 2 + r)}V${n(h / 2)}H${n(-w / 2)}Z`;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: Object.assign(ports4(w, h), {
        lb: [-w / 2, h / 2 - 12],
        rb: [w / 2, h / 2 - 12],
        lt: [-w / 2, -h / 2 + 14],
        rt: [w / 2, -h / 2 + 14]
      }),
      svg: `<path class="hxo" d="${sh}"/>${level(o.id, sh, -w / 2, -h / 2 + 4, w / 2, h / 2)}<path class="hxn" d="${sh}"/>`
    };
  };
  S.vessel = o => {
    const w = o.w || 44,
      h = o.h || 80,
      sh = vcapsule(w, h);
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: Object.assign(ports4(w, h), {
        lb: [-w / 2, h / 4],
        rb: [w / 2, h / 4],
        lt: [-w / 2, -h / 4],
        rt: [w / 2, -h / 4]
      }),
      svg: `<path class="hxo" d="${sh}"/>${level(o.id, sh, -w / 2, -h / 2 + 4, w / 2, h / 2)}<path class="hxn" d="${sh}"/>`
    };
  };
  S.drum = o => {
    const w = o.w || 190,
      h = o.h || 54,
      sh = capsule(w, h);
    let tk = '';
    for (const y of [-h / 4, 0, h / 4]) tk += `M${P(w / 2 - 20, y)}h6`;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: Object.assign(ports4(w, h), {
        tl: [-w / 4, -h / 2],
        tr: [w / 4, -h / 2],
        bl: [-w / 4, h / 2],
        br: [w / 4, h / 2]
      }),
      svg: `<path class="hxo" d="${sh}"/>${level(o.id, sh, -w / 2, -h / 2 + 3, w / 2, h / 2 - 3)}<path class="hxn" d="${sh}"/><path class="hxd" d="${tk}"/>`
    };
  };
  /* shell and tube exchanger (cooler, heater, condenser of a small system) */
  S.exchanger = o => {
    const w = o.w || 110,
      h = o.h || 40,
      sh = capsule(w, h);
    let tb = '';
    for (const y of [-h / 4, 0, h / 4]) tb += `M${P(-w / 2 + h / 2, y)}H${n(w / 2 - h / 2)}`;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: Object.assign(ports4(w, h), {
        tl: [-w / 4, -h / 2],
        tr: [w / 4, -h / 2],
        bl: [-w / 4, h / 2],
        br: [w / 4, h / 2]
      }),
      svg: `<path class="hxo" d="${sh}"/><path class="hxd" d="${tb}M${P(-w / 2 + h / 2, -h / 2)}v${n(h)}M${P(w / 2 - h / 2, -h / 2)}v${n(h)}"/>`
    };
  };
  /* feedwater heater: shell with the U tubes and its own level of drains */
  S.heater = o => {
    const w = o.w || 120,
      h = o.h || 44,
      sh = capsule(w, h),
      x0 = -w / 2 + h / 2,
      x1 = w / 2 - h * 0.7;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: Object.assign(ports4(w, h), {
        tl: [-w / 4, -h / 2],
        tr: [w / 4, -h / 2],
        bl: [-w / 4, h / 2],
        br: [w / 4, h / 2],
        lt: [-w / 2 + 3, -h / 5],
        lb: [-w / 2 + 3, h / 5]
      }),
      svg:
        `<path class="hxo" d="${sh}"/>${level(o.id, sh, -w / 2, h / 2 - h * 0.42, w / 2, h / 2)}<path class="hxn" d="${sh}"/>` +
        `<path class="hxd" d="M${P(x0, -h / 5)}H${n(x1)}A${P(h / 5, h / 5)} 0 0 1 ${P(x1, h / 5)}H${n(x0)}M${P(x0, -h / 2)}v${n(h)}"/>`
    };
  };
  S.deaerator = o => {
    const w = o.w || 190,
      h = o.h || 46,
      w2 = w * 0.42,
      h2 = 26,
      sh = capsule(w, h),
      y2 = -h / 2 - 8 - h2 / 2;
    return {
      box: [-w / 2 - 1, y2 - h2 / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: Object.assign(ports4(w, h), {
        t: [0, y2 - h2 / 2],
        tl: [-w2 / 2, y2],
        tr: [w2 / 2, y2],
        bl: [-w / 4, h / 2],
        br: [w / 4, h / 2],
        sl: [-w / 3, -h / 2],
        sr: [w / 3, -h / 2]
      }),
      svg:
        `<path class="hxn" d="M${P(-w2 / 4, y2 + h2 / 2)}V${n(-h / 2)}M${P(w2 / 4, y2 + h2 / 2)}V${n(-h / 2)}"/>` +
        `<path class="hxo" transform="translate(0 ${n(y2)})" d="${capsule(w2, h2)}"/><path class="hxd" d="${zig(-w2 / 2 + 12, w2 / 2 - 12, y2, 4, 6)}"/>` +
        `<path class="hxo" d="${sh}"/>${level(o.id, sh, -w / 2, -h / 2 + 3, w / 2, h / 2)}<path class="hxn" d="${sh}"/>`
    };
  };
  /* surface condenser with its hotwell */
  S.condenser = o => {
    const w = o.w || 170,
      h = o.h || 86,
      hw = 26,
      y1 = h / 2 - hw,
      sh = `M${P(-w * 0.3, y1)}H${n(w * 0.3)}V${n(h / 2)}H${n(-w * 0.3)}Z`;
    let tb = '';
    for (let i = 0; i < 4; i++) tb += `M${P(-w / 2 + 14, -h / 2 + 14 + i * ((y1 + h / 2 - 28) / 3))}H${n(w / 2 - 14)}`;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: {
        l: [-w / 2, -hw / 2],
        r: [w / 2, -hw / 2],
        t: [0, -h / 2],
        b: [0, h / 2],
        lt: [-w / 2, -h / 2 + 16],
        lb: [-w / 2, y1 - 16],
        rt: [w / 2, -h / 2 + 16],
        rb: [w / 2, y1 - 16],
        hl: [-w * 0.3, y1 + hw / 2],
        hr: [w * 0.3, y1 + hw / 2]
      },
      svg: `<rect class="hxo" x="${n(-w / 2)}" y="${n(-h / 2)}" width="${n(w)}" height="${n(h - hw)}" rx="6"/><path class="hxd" d="${tb}"/><path class="hxo" d="${sh}"/>${level(o.id, sh, -w * 0.3, y1 + 2, w * 0.3, h / 2)}<path class="hxn" d="${sh}"/>`
    };
  };

  /* ---- turbine, generator, electrical ---- */
  S.turbine = o => {
    const w = o.w || 90,
      h = o.h || 70,
      a = o.flip ? 1 : 0.42,
      b = o.flip ? 0.42 : 1;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: {
        l: [-w / 2, 0],
        r: [w / 2, 0],
        t: [0, (-h / 4) * (a + b)],
        b: [0, (h / 4) * (a + b)],
        in: [o.flip ? w / 2 - 12 : -w / 2 + 12, (-h / 2) * (o.flip ? b : a) - 0],
        out: [o.flip ? -w / 2 + 14 : w / 2 - 14, (h / 2) * (o.flip ? a : b) * 0.98]
      },
      svg: `<path class="hxo" d="M${P(-w / 2, (-h / 2) * a)}L${P(w / 2, (-h / 2) * b)}V${n((h / 2) * b)}L${P(-w / 2, (h / 2) * a)}Z"/><path class="hxd" d="M${P(-w / 6, (-h / 2) * (a + (b - a) / 3))}V${n((h / 2) * (a + (b - a) / 3))}M${P(w / 6, (-h / 2) * (a + ((b - a) * 2) / 3))}V${n((h / 2) * (a + ((b - a) * 2) / 3))}"/>`
    };
  };
  S.generator = o => {
    const w = o.w || 84,
      h = o.h || 56;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: ports4(w, h),
      svg:
        rrect(w, h, 8) +
        `<circle class="hxn" r="${n(h * 0.3)}"/><path class="hxs" d="M${P(-h * 0.17, 0)}q${P(h * 0.085, -h * 0.2)} ${P(h * 0.17, 0)}t${P(h * 0.17, 0)}l0 3q${P(-h * 0.085, h * 0.2)} ${P(-h * 0.17, 0)}t${P(-h * 0.17, 0)}Z"/>`
    };
  };
  /* breaker: closed = solid (red), open = hollow (green) */
  S.breaker = () => ({
    box: [-11, -11, 11, 11],
    ports: ports4(20, 20),
    svg: `<rect class="hxo" x="-10" y="-10" width="20" height="20" rx="2"/><rect class="hxs" x="-5.5" y="-5.5" width="11" height="11" rx="1"/>`
  });
  S.transformer = o => {
    const r = o.r || 13;
    return {
      box: [-r - 1, -r * 1.7 - 1, r + 1, r * 1.7 + 1],
      ports: { t: [0, -r * 1.7], b: [0, r * 1.7], l: [-r, 0], r: [r, 0] },
      svg: `<circle class="hxn" cy="${n(-r * 0.7)}" r="${r}"/><circle class="hxn" cy="${n(r * 0.7)}" r="${r}"/>`
    };
  };

  /* ---- boiler ---- */
  /* circulating fluidized bed furnace: tapered lower furnace with the bed, the air distributor and the wind box */
  S.furnace = o => {
    const w = o.w || 130,
      h = o.h || 380,
      wb = 26,
      t = h * 0.26,
      wl = w * 0.6,
      yb = h / 2 - wb,
      yt = yb - t,
      sh = `M${P(-w / 2, -h / 2)}H${n(w / 2)}V${n(yt)}L${P(wl / 2, yb)}H${n(-wl / 2)}L${P(-w / 2, yt)}Z`;
    let dots = '';
    for (let j = 0; j < 4; j++)
      for (let i = 0; i < 7; i++)
        dots += `<circle class="hxbed" cx="${n(-wl / 2 + 8 + ((wl - 16) / 6) * i + (j % 2 ? 4 : -2))}" cy="${n(yb - 8 - j * 9)}" r="1.5"/>`;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: {
        l: [-w / 2, 0],
        r: [w / 2, 0],
        t: [0, -h / 2],
        b: [0, h / 2],
        rt: [w / 2, -h / 2 + 34],
        lt: [-w / 2, -h / 2 + 34],
        rm: [w / 2, yt - 30],
        lm: [-w / 2, yt - 30],
        rl: [(w + wl) / 4, yt + t / 2],
        ll: [-(w + wl) / 4, yt + t / 2],
        wl: [-wl / 2, yb + wb / 2],
        wr: [wl / 2, yb + wb / 2]
      },
      svg: `<path class="hxo" d="${sh}"/>${dots}<path class="hxd" d="M${P(-wl / 2, yb)}H${n(wl / 2)}" style="stroke-dasharray:3 3"/><rect class="hxo" x="${n(-wl / 2)}" y="${n(yb)}" width="${n(wl)}" height="${wb}" rx="2"/>`
    };
  };
  S.cyclone = o => {
    const w = o.w || 70,
      h = o.h || 150,
      c = h * 0.36;
    return {
      box: [-w / 2 - 1, -h / 2 - 9, w / 2 + 1, h / 2 + 1],
      ports: { l: [-w / 2, -h / 2 + 16], r: [w / 2, -h / 2 + 16], t: [0, -h / 2 - 8], b: [0, h / 2] },
      svg: `<path class="hxo" d="M${P(-w / 2, -h / 2)}H${n(w / 2)}V${n(-h / 2 + c)}L${P(7, h / 2)}H-7L${P(-w / 2, -h / 2 + c)}Z"/><path class="hxo" d="M-9 ${n(-h / 2 - 8)}H9V${n(-h / 2 + c * 0.55)}H-9Z"/><path class="hxd" d="M${P(-w / 2, -h / 2 + c)}H${n(w / 2)}"/>`
    };
  };
  /* loop seal (seal pot) that returns the solids of the cyclone to the furnace */
  S.sealpot = o => {
    const w = o.w || 56,
      h = o.h || 30;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: Object.assign(ports4(w, h), { tl: [-w / 4, -h / 2], tr: [w / 4, -h / 2] }),
      svg: `<path class="hxo" d="M${P(-w / 2, -h / 2)}H${n(w / 2)}V${n(h / 2 - 6)}Q${P(w / 2, h / 2)} ${P(w / 2 - 6, h / 2)}H${n(-w / 2 + 6)}Q${P(-w / 2, h / 2)} ${P(-w / 2, h / 2 - 6)}Z"/><path class="hxd" d="M0 ${n(-h / 2)}V${n(h / 2 - 10)}"/>`
    };
  };
  /* a pass of the back pass with its tube banks: banks = number of banks */
  S.backpass = o => {
    const w = o.w || 110,
      h = o.h || 300,
      k = o.banks || 4,
      g = (h - 40) / k;
    let b = '';
    for (let i = 0; i < k; i++)
      b += zig(-w / 2 + 10, w / 2 - 10, -h / 2 + 20 + g * (i + 0.5), Math.min(9, g * 0.28), 9);
    const ports = { l: [-w / 2, 0], r: [w / 2, 0], t: [0, -h / 2], b: [0, h / 2] };
    for (let i = 0; i < k; i++) {
      ports['l' + (i + 1)] = [-w / 2, -h / 2 + 20 + g * (i + 0.5)];
      ports['r' + (i + 1)] = [w / 2, -h / 2 + 20 + g * (i + 0.5)];
    }
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports,
      svg: rrect(w, h, 4) + `<path class="hxd" d="${b}"/>`
    };
  };
  /* one tube bank alone (a superheater, a reheater, an economizer drawn on the steam or water side) */
  S.bank = o => {
    const w = o.w || 84,
      h = o.h || 44;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: ports4(w, h),
      svg: rrect(w, h, 5) + `<path class="hxd" d="${zig(-w / 2 + 9, w / 2 - 9, 0, h * 0.26, 7)}"/>`
    };
  };
  /* rotary (regenerative) air preheater seen from above: the rotor turns while its drive runs */
  S.airheater = o => {
    const r = o.r || 46;
    let sp = '';
    for (let i = 0; i < 12; i++)
      sp += `M0 0L${P(r * 0.9 * Math.cos((i * Math.PI) / 6), r * 0.9 * Math.sin((i * Math.PI) / 6))}`;
    return {
      box: [-r - 1, -r - 1, r + 1, r + 1],
      ports: {
        l: [-r, 0],
        r: [r, 0],
        t: [0, -r],
        b: [0, r],
        lt: [-r * 0.7, -r * 0.7],
        lb: [-r * 0.7, r * 0.7],
        rt: [r * 0.7, -r * 0.7],
        rb: [r * 0.7, r * 0.7]
      },
      svg: `<circle class="hxo" r="${r}"/><g class="hxr hxslow"><path class="hxd" d="${sp}"/></g><circle class="hxn" r="${n(r * 0.9)}"/><circle class="hxo hxs" r="${n(r * 0.16)}"/>`
    };
  };
  /* electrostatic precipitator: fields = number of fields, each with its hopper */
  S.precipitator = o => {
    const w = o.w || 200,
      h = o.h || 90,
      k = o.fields || 5,
      hp = 22,
      y1 = h / 2 - hp,
      fw = w / k;
    let d = '',
      hop = '';
    for (let i = 0; i < k; i++) {
      if (i) d += `M${P(-w / 2 + fw * i, -h / 2)}V${n(y1)}`;
      hop += `M${P(-w / 2 + fw * i + 3, y1)}L${P(-w / 2 + fw * (i + 0.5), h / 2)}L${P(-w / 2 + fw * (i + 1) - 3, y1)}`;
    }
    const ports = { l: [-w / 2, -hp / 2], r: [w / 2, -hp / 2], t: [0, -h / 2], b: [0, h / 2] };
    for (let i = 0; i < k; i++) ports['h' + (i + 1)] = [-w / 2 + fw * (i + 0.5), h / 2];
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports,
      svg: `<rect class="hxo" x="${n(-w / 2)}" y="${n(-h / 2)}" width="${n(w)}" height="${n(h - hp)}" rx="3"/><path class="hxd" d="${d}"/><path class="hxn" d="${hop}"/>`
    };
  };
  S.stack = o => {
    const w = o.w || 34,
      h = o.h || 200;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: { l: [-w / 2 + 2, h / 2 - 16], r: [w / 2 - 2, h / 2 - 16], t: [0, -h / 2], b: [0, h / 2] },
      svg: `<path class="hxo" d="M${P(-w * 0.3, -h / 2)}H${n(w * 0.3)}L${P(w / 2, h / 2)}H${n(-w / 2)}Z"/>`
    };
  };
  /* oil burner: the flame shows only while the page says it is lit (class hx-run on the node) */
  S.burner = () => ({
    box: [-22, -11, 30, 11],
    ports: { l: [-22, 0], r: [28, 0], t: [-8, -9], b: [-8, 9] },
    svg: `<path class="hxo" d="M-22 -6H-2L6 -9V9L-2 6H-22Z"/><path class="hxs hxflame" d="M8 0Q14 -9 28 0Q14 9 8 0Z"/>`
  });

  /* ---- solids ---- */
  S.bunker = o => {
    const w = o.w || 70,
      h = o.h || 100,
      c = h * 0.38,
      sh = `M${P(-w / 2, -h / 2)}H${n(w / 2)}V${n(h / 2 - c)}L${P(7, h / 2)}H-7L${P(-w / 2, h / 2 - c)}Z`;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: ports4(w, h),
      svg: `<path class="hxo" d="${sh}"/>${level(o.id, sh, -w / 2, -h / 2 + 4, w / 2, h / 2)}<path class="hxn" d="${sh}"/>`
    };
  };
  /* belt feeder or conveyor: the pulleys take the state colour */
  S.conveyor = o => {
    const w = o.w || 90,
      h = 14;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: {
        l: [-w / 2, 0],
        r: [w / 2, 0],
        t: [-w / 2 + 12, -h / 2],
        b: [w / 2 - 8, h / 2],
        tl: [-w / 2 + 12, -h / 2],
        br: [w / 2 - 8, h / 2]
      },
      svg: `<path class="hxo" d="${capsule(w, h)}"/><circle class="hxs" cx="${n(-w / 2 + h / 2)}" r="3.6"/><circle class="hxs" cx="${n(w / 2 - h / 2)}" r="3.6"/>`
    };
  };
  /* screw conveyor / water cooled screw cooler */
  S.screw = o => {
    const w = o.w || 90,
      h = 18;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: { l: [-w / 2, 0], r: [w / 2, 0], t: [-w / 2 + 12, -h / 2], b: [w / 2 - 10, h / 2] },
      svg: `<path class="hxo" d="${capsule(w, h)}"/><path class="hxn hxs2" d="${zig(-w / 2 + 8, w / 2 - 8, 0, 5, Math.round(w / 9))}"/>`
    };
  };
  /* rotary (air lock) valve under a hopper */
  S.rotary = o => {
    const r = o.r || 11;
    return {
      box: [-r - 1, -r - 1, r + 1, r + 1],
      ports: { l: [-r, 0], r: [r, 0], t: [0, -r], b: [0, r] },
      svg: `<circle class="hxo" r="${r}"/><g class="hxr"><path class="hxs" d="M${P(-r * 0.8, -1.6)}H${n(r * 0.8)}V1.6H${n(-r * 0.8)}ZM-1.6 ${n(-r * 0.8)}V${n(r * 0.8)}H1.6V${n(-r * 0.8)}Z"/></g>`
    };
  };

  /* drain pot under a steam line */
  S.pot = () => ({
    box: [-6, -11, 6, 11],
    ports: { t: [0, -10], b: [0, 10], l: [-5, 0], r: [5, 0] },
    svg: `<path class="hxo" d="${vcapsule(10, 20)}"/>`
  });
  /* reheater: inlet header, four tube assemblies, outlet header (steam from the top header to the bottom one in the drawing) */
  S.reheater = o => {
    const w = o.w || 104,
      h = o.h || 124,
      hd = 15,
      g = (h - 2 * hd - 8) / 4;
    let b = '';
    for (let i = 0; i < 4; i++)
      b += zig(-w / 2 + 16, w / 2 - 16, -h / 2 + hd + 4 + g * (i + 0.5), Math.min(7, g * 0.3), 9);
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: {
        t: [0, -h / 2],
        b: [0, h / 2],
        l: [-w / 2, 0],
        r: [w / 2, 0],
        tl: [-w / 2, -h / 2 + hd / 2],
        tr: [w / 2, -h / 2 + hd / 2],
        bl: [-w / 2, h / 2 - hd / 2],
        br: [w / 2, h / 2 - hd / 2]
      },
      svg: `<rect class="hxo" x="${n(-w / 2 + 8)}" y="${n(-h / 2 + hd)}" width="${n(w - 16)}" height="${n(h - 2 * hd)}"/><path class="hxd" d="${b}"/><rect class="hxo" x="${n(-w / 2)}" y="${n(-h / 2)}" width="${n(w)}" height="${hd}" rx="4"/><rect class="hxo" x="${n(-w / 2)}" y="${n(h / 2 - hd)}" width="${n(w)}" height="${hd}" rx="4"/>`
    };
  };

  /* ---- small things on a line ---- */
  S.filter = o => {
    const w = o.w || 26;
    return {
      box: [-w / 2 - 1, -w / 2 - 1, w / 2 + 1, w / 2 + 1],
      ports: ports4(w, w),
      svg: `<rect class="hxo" x="${n(-w / 2)}" y="${n(-w / 2)}" width="${w}" height="${w}" rx="3"/><path class="hxd" style="stroke-dasharray:3 2.4" d="M${P(-w / 2, w / 2)}L${P(w / 2, -w / 2)}"/>`
    };
  };
  /* dryer of compressed air: twin towers */
  S.dryer = () => ({
    box: [-19, -21, 19, 21],
    ports: ports4(36, 40),
    svg: `<path class="hxo" transform="translate(-9 0)" d="${vcapsule(14, 40)}"/><path class="hxo" transform="translate(9 0)" d="${vcapsule(14, 40)}"/><path class="hxd" d="M-9 -8H9M-9 8H9"/>`
  });
  /* spray (attemperator / desuperheater) on a steam line */
  S.spray = () => ({
    box: [-11, -11, 11, 11],
    ports: ports4(20, 20),
    svg: `<circle class="hxo" r="10"/><path class="hxd" d="M0 -10V-3M0 -3L-5 4M0 -3V5M0 -3L5 4"/>`
  });
  /* ejector / silencer / vent to atmosphere */
  S.vent = () => ({
    box: [-9, -16, 9, 1],
    ports: { b: [0, 0], t: [0, -15], l: [-8, -8], r: [8, -8] },
    svg: `<path class="hxo" d="M-4 0V-6L-8 -15H8L4 -6V0Z"/>`
  });
  /* analyzer / instrument that stands alone */
  S.analyzer = () => ({
    box: [-12, -10, 12, 10],
    ports: ports4(22, 18),
    svg: `<rect class="hxo" x="-11" y="-9" width="22" height="18" rx="4"/><path class="hxd" d="M-6 2q3 -8 6 0t6 0"/>`
  });
  /* header / bus bar: a thick bar that lines join */
  S.header = o => {
    const w = o.w || 120,
      h = o.h || 8;
    return {
      box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1],
      ports: ports4(w, h),
      svg: `<rect class="hxk" x="${n(-w / 2)}" y="${n(-h / 2)}" width="${n(w)}" height="${n(h)}" rx="${n(Math.min(w, h) / 2)}"/>`
    };
  };
  /* a plain block for a package that has no picture of its own (a skid, a panel) */
  S.block = o => {
    const w = o.w || 100,
      h = o.h || 50;
    return { box: [-w / 2 - 1, -h / 2 - 1, w / 2 + 1, h / 2 + 1], ports: ports4(w, h), svg: rrect(w, h, 6) };
  };
  window.HXSYM = S;
})();

/* HX core: builds a plant page from a short description (hx-pages.js) and keeps it live. It knows nothing about the simulator:
   every number, state and click goes through ONE object, HX.data (the adapter). The mockup gives it sample data (hx-sample.js);
   the app gives it the real signals (README: "Putting it in the app").
     HX.data = {
       time()                  -> seconds of simulation time
       value(key)              -> number | null     key = a transmitter tag exactly as the app pages use it (data-v), or 'SHEET|ADDRESS'
       machine(name)           -> { st: 'run' | 'stop' | 'trip' | null, mode: 'Remote · Auto' | null, perm: true | false | null }
       loop(tag)               -> { pv, sv, mv, mode: 'AUTO' | 'MANUAL' | 'REMOTE' | ..., unit } | null
       valve(tag)              -> { pct: number | null, open: true | false | null, mode: string | null }
       open(kind, id, second)  -> opens a faceplate: kind = 'mach' | 'loop' | 'valve' | 'value'; second = true is the
                                  PERMISSIVE · TREND · MONITOR faceplate (the Y / N square), false the CONTROL faceplate
     }
   A page = lanes. A lane is one stream (its medium gives the colour) drawn left to right through its items; an array inside a
   lane is equipment in parallel (pump A / B). Items are made with HX.E (equipment), HX.M (machine), HX.C (control valve or damper
   with its loop), HX.X (on / off valve), HX.L (link to another page). The core places everything on a 1280 x 640 drawing. */
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg',
    W = 1280,
    H = 640,
    SYM = window.HXSYM;
  const HX = (window.HX = { pages: [], byId: {}, W, H, data: null });
  const esc = s =>
    String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const n1 = x => String(Math.round(x * 10) / 10);
  const fmt = (v, dp) =>
    v == null || !isFinite(v) ? '-----' : (+v).toFixed(dp == null ? 1 : dp).replace(/^-(0(?:\.0+)?)$/, '$1');
  const el = (tag, cls, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  };

  /* ---------- what a page is made of ---------- */
  HX.V = (label, key, unit, dp) => ({ label, key, unit: unit || '', dp: dp == null ? 1 : dp });
  HX.E = (sym, name, tag, vals, o) => Object.assign({ k: 'eq', sym, name, tag: tag || '', vals: vals || [] }, o || {});
  HX.M = (sym, mach, name, vals, o) => Object.assign({ k: 'mach', sym, mach, name, vals: vals || [] }, o || {});
  HX.C = (loop, name, o) => Object.assign({ k: 'loop', sym: 'valve', kind: 'control', loop, name, vals: [] }, o || {});
  HX.X = (valve, name, o) =>
    Object.assign(
      { k: 'valve', sym: 'valve', kind: /^MV/.test(valve) ? 'motor' : 'shutoff', valve, name, vals: [] },
      o || {}
    );
  HX.L = (to, text, o) => Object.assign({ k: 'link', to, name: text }, o || {});
  HX.page = def => {
    def.no = HX.pages.length + 1;
    HX.pages.push(def);
    HX.byId[def.id] = def;
  };
  const MEDIA = {
    steam: 'Steam',
    reheat: 'Reheat steam',
    water: 'Feedwater',
    condensate: 'Condensate',
    cooling: 'Cooling water',
    sea: 'Sea water',
    air: 'Air',
    hotair: 'Hot air',
    gas: 'Flue gas',
    oil: 'Fuel oil',
    coal: 'Coal',
    solid: 'Limestone / sand',
    ash: 'Ash',
    lube: 'Oil',
    power: 'Electric power',
    drain: 'Drain / vent',
    signal: 'Control signal'
  };
  const regName = it => (it.k === 'mach' ? it.mach : it.k === 'loop' ? it.loop : it.k === 'valve' ? it.valve : '');
  const tagOf = it => {
    if (it.tag != null && it.tag !== '') return it.tag;
    const R = window.HXREG || {},
      m = it.k === 'mach' && R.machines && R.machines[it.mach];
    if (it.k === 'mach') return m && m.t && m.t.length < 14 ? it.mach + ' · ' + m.t : it.mach;
    return regName(it);
  };

  /* ---------- flow of a line: 'm:NAME' running, 'x:VALVE' open, 'l:LOOP' output > 1 %, 'v:KEY>n'; a | b = any ---------- */
  const flowing = spec => {
    if (!spec) return null;
    const D = HX.data;
    return String(spec)
      .split('|')
      .some(s => {
        const k = s.slice(0, 2),
          a = s.slice(2);
        if (k === 'm:') return (D.machine(a) || {}).st === 'run';
        if (k === 'x:') {
          const v = D.valve(a) || {};
          return v.open === true || v.pct > 1;
        }
        if (k === 'l:') return ((D.loop(a) || {}).mv || 0) > 1;
        if (k === 'v:') {
          const m = a.split('>');
          return (D.value(m[0]) || 0) > +(m[1] || 0);
        }
        return false;
      });
  };

  /* ---------- geometry ---------- */
  const rpath = (p, r) => {
    r = r == null ? 7 : r;
    let d = `M${n1(p[0][0])} ${n1(p[0][1])}`;
    for (let i = 1; i < p.length; i++) {
      const a = p[i - 1],
        b = p[i],
        c = p[i + 1];
      if (!c) {
        d += `L${n1(b[0])} ${n1(b[1])}`;
        break;
      }
      const l1 = Math.hypot(b[0] - a[0], b[1] - a[1]),
        l2 = Math.hypot(c[0] - b[0], c[1] - b[1]),
        q = Math.min(r, l1 / 2, l2 / 2);
      if (q < 0.5) {
        d += `L${n1(b[0])} ${n1(b[1])}`;
        continue;
      }
      d += `L${n1(b[0] - ((b[0] - a[0]) / l1) * q)} ${n1(b[1] - ((b[1] - a[1]) / l1) * q)}Q${n1(b[0])} ${n1(b[1])} ${n1(b[0] + ((c[0] - b[0]) / l2) * q)} ${n1(b[1] + ((c[1] - b[1]) / l2) * q)}`;
    }
    return d;
  };
  /* right-angle route from a to b: 'h' = leave sideways (bend at mid x), 'v' = leave up / down (bend at mid y) */
  const route = (a, b, how, mid) => {
    if (Math.abs(a[1] - b[1]) < 0.6 || Math.abs(a[0] - b[0]) < 0.6) return [a, b];
    if (how === 'vh') return [a, [a[0], b[1]], b];
    if (how === 'hv') return [a, [b[0], a[1]], b];
    if (how === 'v') {
      const y = mid == null ? (a[1] + b[1]) / 2 : mid;
      return [a, [a[0], y], [b[0], y], b];
    }
    const x = mid == null ? (a[0] + b[0]) / 2 : mid;
    return [a, [x, a[1]], [x, b[1]], b];
  };
  const wrap = (s, max) => {
    const w = String(s).split(' '),
      out = [];
    let c = '';
    for (const x of w) {
      if (c && (c + ' ' + x).length > max) {
        out.push(c);
        c = x;
      } else c = c ? c + ' ' + x : x;
    }
    if (c) out.push(c);
    return out.slice(0, 3);
  };

  /* ---------- layout: lanes -> positions ---------- */
  /* room of one item above and below its centre: symbol + the words the core writes around it */
  function measure(it) {
    if (it.k === 'link') return { up: 15, dn: 15 };
    const box = SYM[it.sym](Object.assign({ id: 'm' }, it)).box,
      side = it.lab === 'r' || it.lab === 'l',
      lines = it.name ? wrap(it.name, it.wrap || (side ? 22 : 19)).length : 0,
      tg = tagOf(it) ? 1 : 0,
      rows =
        (it.k === 'mach' || it.k === 'valve' ? 1 : 0) + (it.k === 'loop' ? 1 + (it.pv ? 1 : 0) : 0) + it.vals.length;
    if (side) {
      const hh = ((lines + tg + rows) * 14) / 2 + 4;
      return { up: Math.max(-box[1] + 2, hh), dn: Math.max(box[3] + 2, hh) };
    }
    return { up: -box[1] + 8 + lines * 14 + tg * 11.5, dn: box[3] + 6 + rows * 14.5 };
  }
  function layout(def) {
    const X0 = 26,
      X1 = W - 26,
      PAD = 12,
      LAB = 24;
    let uid = 0;
    const lanes = def.lanes.map(l => ({ src: l, cols: l.items.map(it => (Array.isArray(it) ? it : [it])) }));
    for (const L of lanes) {
      L.upS = 0;
      L.dnS = 0;
      L.stack = 0;
      for (const col of L.cols) {
        for (const it of col) it._m = measure(it);
        if (col.length === 1) {
          L.upS = Math.max(L.upS, col[0]._m.up);
          L.dnS = Math.max(L.dnS, col[0]._m.dn);
        } else {
          col._tot = col.reduce((a, it) => a + it._m.up + it._m.dn, 0) + PAD * (col.length - 1);
          L.stack = Math.max(L.stack, col._tot);
        }
      }
      L.need = Math.max(L.upS + L.dnS, L.stack) + (L.src.label ? LAB : 8);
    }
    /* a page with many rows grows downwards (the width, and so the size of the text, stays) */
    const tot = lanes.reduce((a, L) => a + L.need, 0),
      Hp = Math.max(H, Math.ceil(tot + 12)),
      free = Hp - 12 - tot;
    let y = 6;
    const nodes = [];
    for (const L of lanes) {
      const hh = L.need + (free * L.need) / tot,
        lab = L.src.label ? LAB : 8,
        inner = hh - lab,
        mid = y + lab + inner / 2;
      L.top = y;
      L.cy = L.src.y != null ? L.src.y : mid + (L.upS - L.dnS) / 2;
      y += hh;
      const n = L.cols.length;
      L.cols.forEach((col, j) => {
        let cur = mid - (col._tot || 0) / 2;
        col.forEach((it, i) => {
          const jj = L.src.rev ? n - 1 - j : j,
            at = it.at != null ? it.at : col[0].at;
          it._id = it.id || 'n' + ++uid;
          it._x = at != null ? X0 + ((X1 - X0) * at) / 100 : X0 + ((X1 - X0) * (jj + 0.5)) / n;
          if (col.length === 1) it._y = L.cy + (it.dy || 0);
          else {
            it._y = cur + it._m.up;
            cur += it._m.up + it._m.dn + PAD;
          }
          it._lane = L;
          nodes.push(it);
        });
      });
    }
    return { lanes, nodes, H: Hp };
  }

  /* ---------- one node: symbol + its words ---------- */
  /* rot: a symbol may be turned (90, -90) to sit on a vertical line. lab: where its words go: 't' name above and details below,
     'b' all below, 'r' / 'l' all beside it */
  const rotP = (p, r) => (r === 90 ? [-p[1], p[0]] : r === -90 ? [p[1], -p[0]] : r === 180 ? [-p[0], -p[1]] : p);
  function drawNode(it, pageId) {
    const x = it._x,
      y = it._y;
    if (it.k === 'link') {
      const t = it.name,
        w = Math.max(74, t.length * 6.3 + 22),
        back = it.back;
      it._p = { l: [x - w / 2, y], r: [x + w / 2, y], t: [x, y - 13], b: [x, y + 13] };
      it._box = [x - w / 2, y - 13, x + w / 2, y + 13];
      return `<g class="hx-link" data-go="${esc(it.to)}" tabindex="0" role="link" transform="translate(${n1(x)} ${n1(y)})"><rect x="${n1(-w / 2)}" y="-13" width="${n1(w)}" height="26" rx="13"/><text x="0" y="4" text-anchor="middle">${back ? '‹ ' : ''}${esc(t)}${back ? '' : ' ›'}</text></g>`;
    }
    const sy = SYM[it.sym](Object.assign({ id: pageId + '-' + it._id }, it)),
      rot = it.rot || 0;
    let box = sy.box,
      ports = sy.ports;
    if (rot) {
      const c = [
        [box[0], box[1]],
        [box[2], box[1]],
        [box[0], box[3]],
        [box[2], box[3]]
      ].map(q => rotP(q, rot));
      box = [
        Math.min(...c.map(q => q[0])),
        Math.min(...c.map(q => q[1])),
        Math.max(...c.map(q => q[0])),
        Math.max(...c.map(q => q[1]))
      ];
      ports = Object.fromEntries(Object.entries(ports).map(([k, q]) => [k, rotP(q, rot)]));
    }
    it._p = Object.fromEntries(Object.entries(ports).map(([k, q]) => [k, [x + q[0], y + q[1]]]));
    it._box = [x + box[0], y + box[1], x + box[2], y + box[3]];
    const open =
      it.k === 'mach'
        ? 'mach:' + it.mach
        : it.k === 'loop'
          ? 'loop:' + it.loop
          : it.k === 'valve'
            ? 'valve:' + it.valve
            : '';
    const lab = it.lab || 't',
      side = lab === 'r' || lab === 'l';
    const lines = it.name ? wrap(it.name, it.wrap || (side ? 22 : 19)) : [],
      tg = tagOf(it);
    /* the rows of words: each gives its svg at (x, baseline y, anchor) */
    const head = [],
      body = [];
    for (const ln of lines)
      head.push([
        14,
        (bx, by, an) => `<text class="hx-name" x="${n1(bx)}" y="${n1(by)}" text-anchor="${an}">${esc(ln)}</text>`
      ]);
    if (tg)
      head.push([
        11.5,
        (bx, by, an) => `<text class="hx-tag" x="${n1(bx)}" y="${n1(by - 1.5)}" text-anchor="${an}">${esc(tg)}</text>`
      ]);
    if (it.k === 'mach')
      body.push([
        14.5,
        (bx, by, an) =>
          `<text class="hx-st none" data-st="${esc(it.mach)}" x="${n1(bx)}" y="${n1(by)}" text-anchor="${an}">-----</text>`
      ]);
    if (it.k === 'valve')
      body.push([
        14.5,
        (bx, by, an) =>
          `<text class="hx-st none" data-vs="${esc(it.valve)}" x="${n1(bx)}" y="${n1(by)}" text-anchor="${an}">-----</text>`
      ]);
    if (it.k === 'loop') {
      body.push([
        16.5,
        (bx, by, an) =>
          `<g class="hx-mode" data-mode="${esc(it.loop)}" transform="translate(${n1(bx - (an === 'middle' ? 46 : an === 'end' ? 92 : 0))} ${n1(by - 11)})"><rect width="50" height="15" rx="7.5"/><text x="25" y="11" text-anchor="middle">-----</text><text class="hx-val" data-lp="${esc(it.loop)}|mv" x="56" y="11.5">-----</text><text class="hx-unit" x="86" y="11.5"> %</text></g>`
      ]);
      if (it.pv) {
        const dp = it.pvdp == null ? 1 : it.pvdp;
        body.push([
          14.5,
          (bx, by, an) =>
            `<text class="hx-lab" x="${n1(bx)}" y="${n1(by)}" text-anchor="${an}">PV <tspan class="hx-val" data-lp="${esc(it.loop)}|pv|${dp}">-----</tspan> · SV <tspan class="hx-val" data-lp="${esc(it.loop)}|sv|${dp}">-----</tspan><tspan class="hx-unit"> ${esc(it.pv === true ? '' : it.pv)}</tspan></text>`
        ]);
      }
    }
    for (const v of it.vals)
      body.push([
        14,
        (bx, by, an) =>
          an === 'middle'
            ? `<text class="hx-lab" x="${n1(bx - 4)}" y="${n1(by)}" text-anchor="end">${esc(v.label)}</text><text x="${n1(bx + 3)}" y="${n1(by)}"><tspan class="hx-val" data-hv="${esc(v.key)}" data-dp="${v.dp}">-----</tspan><tspan class="hx-unit"> ${esc(v.unit)}</tspan></text>`
            : `<text class="hx-lab" x="${n1(bx)}" y="${n1(by)}" text-anchor="${an}">${esc(v.label)} <tspan class="hx-val" data-hv="${esc(v.key)}" data-dp="${v.dp}">-----</tspan><tspan class="hx-unit"> ${esc(v.unit)}</tspan></text>`
      ]);
    let words = '';
    if (side) {
      const all = head.concat(body),
        tot = all.reduce((q, r) => q + r[0], 0),
        bx = lab === 'r' ? box[2] + 7 : box[0] - 7;
      let by = -tot / 2 + 10 + (it.ly || 0);
      for (const r of all) {
        words += r[1](bx, by, lab === 'r' ? 'start' : 'end');
        by += r[0];
      }
    } else {
      let by;
      if (lab === 'b') {
        by = box[3] + 13;
        for (const r of head.concat(body)) {
          words += r[1](0, by, 'middle');
          by += r[0];
        }
      } else {
        by = box[1] - 6;
        for (let i = head.length - 1; i >= 0; i--) {
          words += head[i][1](0, by, 'middle');
          by -= head[i][0];
        }
        by = box[3] + 15;
        for (const r of body) {
          words += r[1](0, by, 'middle');
          by += r[0];
        }
      }
    }
    const yn =
      it.k === 'mach'
        ? `<g class="hx-yn" data-yn="${esc(it.mach)}" transform="translate(${n1(box[2] + 2)} ${n1(box[1] - 2)})"><title>Permissive · trend · monitor</title><rect width="14" height="14" rx="3"/><text x="7" y="10.4" text-anchor="middle">-</text></g>`
        : '';
    const attr = open
      ? ` data-open="${esc(open)}" tabindex="0" role="button" aria-label="${esc(it.name || tg)}"`
      : it.go
        ? ` data-go="${esc(it.go)}" data-open="" tabindex="0" role="link" aria-label="${esc(it.name)}"`
        : '';
    const on = it.on
      ? ` data-on="${esc(it.on)}"`
      : it.k === 'mach'
        ? ` data-ms="${esc(it.mach)}"`
        : it.k === 'valve'
          ? ` data-vv="${esc(it.valve)}"`
          : it.k === 'loop'
            ? ` data-lv2="${esc(it.loop)}"`
            : '';
    const lv = it.level ? ` data-level="${esc(it.level.join('|'))}"` : '';
    return `<g class="hx-node hx-none"${attr}${on}${lv} transform="translate(${n1(x)} ${n1(y)})"><rect class="hx-hit" x="${n1(box[0] - 4)}" y="${n1(box[1] - 4)}" width="${n1(box[2] - box[0] + 8)}" height="${n1(box[3] - box[1] + 8)}"/>${rot ? `<g transform="rotate(${rot})">${sy.svg}</g>` : sy.svg}${words}${yn}</g>`;
  }

  /* ---------- lines of a lane ---------- */
  function drawLines(L, joins) {
    const out = [],
      med = L.src.med,
      w = L.src.w || 4;
    const seg = (pts, flow, m, ww) =>
      out.push({ d: rpath(pts), med: m || med, w: ww || w, flow: flow === undefined ? L.src.flow : flow });
    const rev = L.src.rev;
    const P = (it, side) => it._p[side === 'in' ? it.pin || (rev ? 'r' : 'l') : it.pout || (rev ? 'l' : 'r')];
    if (L.src.noline) return out;
    for (let j = 0; j < L.cols.length - 1; j++) {
      const A = L.cols[j],
        B = L.cols[j + 1];
      if (L.src.cut && L.src.cut.includes(j)) continue;
      const fl = A.length > 1 || B.length > 1 ? null : undefined;
      if (A.length === 1 && B.length === 1)
        seg(route(P(A[0], 'out'), P(B[0], 'in'), 'h'), A[0].flow || undefined, A[0].med);
      else if (A.length === B.length)
        A.forEach((a, i) => seg(route(P(a, 'out'), P(B[i], 'in'), 'h'), a.flow || B[i].flow || fl, a.med));
      else {
        const ax = Math.max(...A.map(a => P(a, 'out')[0])),
          bx = Math.min(...B.map(b => P(b, 'in')[0])),
          mx = (ax + bx) / 2;
        if (A.length === 1)
          B.forEach(b => seg(route(P(A[0], 'out'), P(b, 'in'), 'h', mx - (B.length > 1 ? 0 : 0)), b.flow || fl));
        else if (B.length === 1) A.forEach(a => seg(route(P(a, 'out'), P(B[0], 'in'), 'h', mx), a.flow || fl, a.med));
        else {
          A.forEach(a => seg(route(P(a, 'out'), [mx, L.cy], 'hv'), a.flow || fl));
          B.forEach(b => seg(route([mx, L.cy], P(b, 'in'), 'vh'), b.flow || fl));
        }
      }
    }
    return out;
  }

  /* ---------- the Process view ---------- */
  function drawProcess(def) {
    if (def.plan) return drawPlan(def);
    const lay = layout(def);
    def._lay = lay;
    const byId = {};
    let nodes = '';
    for (const it of lay.nodes) {
      nodes += drawNode(it, def.id);
      byId[it._id] = it;
    }
    let lines = [];
    for (const L of lay.lanes) lines = lines.concat(drawLines(L));
    for (const j of def.joins || []) {
      const [ai, ap] = j.from.split('.'),
        [bi, bp] = j.to.split('.'),
        a = byId[ai],
        b = byId[bi];
      if (!a || !b) {
        console.warn('HX: join of page ' + def.id + ' names a missing item', j);
        continue;
      }
      const pa = a._p[ap || 'r'],
        pb = b._p[bp || 'l'];
      const how =
        j.via ||
        (/^[tb]/.test(ap || 'r') ? (/^[tb]/.test(bp || 'l') ? 'v' : 'vh') : /^[tb]/.test(bp || 'l') ? 'hv' : 'h');
      lines.push({ d: rpath(route(pa, pb, how, j.mid)), med: j.med, w: j.w || 3, flow: j.flow, dash: j.dash });
    }
    let ls = '';
    for (const l of lines)
      ls += `<g class="hx-idle"${l.flow ? ` data-flow="${esc(l.flow)}"` : ' data-flow=""'}><path class="hx-ln" d="${l.d}" style="stroke:var(--hx-m-${l.med});stroke-width:${l.w}${l.dash ? ';stroke-dasharray:6 5' : ''}"/><path class="hx-lnf" d="${l.d}"/></g>`;
    let lab = '';
    for (const L of lay.lanes)
      if (L.src.label) lab += `<text class="hx-lane" x="26" y="${n1(L.top + 16)}">${esc(L.src.label)}</text>`;
    for (const t of def.notes || [])
      lab += `<text class="hx-note" x="${t[0]}" y="${t[1] < 0 ? lay.H + t[1] : t[1]}" text-anchor="${t[3] || 'start'}">${esc(t[2])}</text>`;
    const used = [...new Set(lines.map(l => l.med))];
    const legend =
      used.map(m => `<span><i style="background:var(--hx-m-${m})"></i>${MEDIA[m] || m}</span>`).join('') +
      `<em>Red = running / open · Green = stopped / closed · Y = permissive complete</em>`;
    return {
      svg: `<svg viewBox="0 0 ${W} ${lay.H}" role="img" aria-label="${esc(def.title)} process">${lab}${ls}${nodes}</svg>`,
      legend
    };
  }

  /* ---------- a page drawn as a plan: every item at its own place, every pipe from point to point ----------
     def.plan = { h, items: [item with x, y (+ rot, lab)], pipes: [{ med, w, flow, pts, to, arrow }], taps: [...], texts: [...],
     signals: [{ pts }] }. A point of a pipe is 'id.port' or [x, y]; null = the same x or y as the point before. Two points
     that are not in line get a right-angle bend (sideways first; vfirst: up / down first). */
  function drawPlan(def) {
    const P = def.plan,
      byId = {};
    let uid = 0,
      nodes = '';
    for (const it of P.items) {
      it._id = it.id || 'p' + ++uid;
      it._x = it.x;
      it._y = it.y;
      nodes += drawNode(it, def.id);
      byId[it._id] = it;
    }
    const pt = (q, prev) => {
      if (typeof q === 'string') {
        const [i, port] = q.split('.'),
          it = byId[i];
        if (!it || !it._p[port || 'r']) {
          console.warn('HX: pipe of page ' + def.id + ' names a missing point ' + q);
          return prev || [0, 0];
        }
        return it._p[port || 'r'];
      }
      return [q[0] == null ? prev[0] : q[0], q[1] == null ? prev[1] : q[1]];
    };
    const path = pp => {
      const raw = [];
      for (const q of pp.pts) raw.push(pt(q, raw[raw.length - 1]));
      const o = [raw[0]];
      for (let i = 1; i < raw.length; i++) {
        const a = o[o.length - 1],
          b = raw[i];
        if (Math.abs(a[0] - b[0]) > 0.6 && Math.abs(a[1] - b[1]) > 0.6) o.push(pp.vfirst ? [a[0], b[1]] : [b[0], a[1]]);
        o.push(b);
      }
      return o;
    };
    const head = (a, b, med, at) => {
      const an = (Math.atan2(b[1] - a[1], b[0] - a[0]) * 180) / Math.PI,
        m = at || [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      return `<path class="hx-arw" transform="translate(${n1(m[0])} ${n1(m[1])}) rotate(${n1(an)})" d="M-5 -4.6L5 0L-5 4.6Z" style="fill:var(--hx-m-${med})"/>`;
    };
    let ls = '',
      ends = '';
    const used = [];
    for (const pp of P.pipes) {
      const o = path(pp),
        w = pp.w || 4;
      if (!used.includes(pp.med)) used.push(pp.med);
      let ar = '';
      if (pp.arrow !== false) {
        let bi = 0,
          bl = 0;
        for (let i = 1; i < o.length; i++) {
          const l = Math.hypot(o[i][0] - o[i - 1][0], o[i][1] - o[i - 1][1]);
          if (l > bl) ((bl = l), (bi = i));
        }
        if (bl >= 44) ar = head(o[bi - 1], o[bi], pp.med);
      }
      if (pp.to) {
        const a = o[o.length - 2],
          b = o[o.length - 1],
          dx = Math.sign(Math.round(b[0] - a[0])),
          dy = Math.sign(Math.round(b[1] - a[1]));
        ar += head(a, b, pp.med, [b[0] + dx * 4, b[1] + dy * 4]);
        ends += `<text class="hx-end" x="${n1(b[0] + dx * 13)}" y="${n1(b[1] + dy * 13 + (dy > 0 ? 8 : dy < 0 ? -2 : 3.5))}" text-anchor="${dx > 0 ? 'start' : dx < 0 ? 'end' : 'middle'}">${esc(pp.to)}</text>`;
      }
      const d = rpath(o, pp.r);
      ls += `<g class="hx-idle" data-flow="${esc(pp.flow || '')}"><path class="hx-ln" d="${d}" style="stroke:var(--hx-m-${pp.med});stroke-width:${w}"/><path class="hx-lnf" d="${d}"/>${ar}</g>`;
    }
    let sig = '';
    for (const sg of P.signals || []) sig += `<path class="hx-sig" d="${rpath(path(sg), 4)}"/>`;
    /* a tap: the transmitter on its line, with its words on one side */
    let taps = '';
    for (const t of P.taps || []) {
      const sd = t.side || 't',
        an = sd === 'r' ? 'start' : sd === 'l' ? 'end' : 'middle',
        bx = sd === 'r' ? 9 : sd === 'l' ? -9 : 0,
        y0 = sd === 't' ? -37 : sd === 'b' ? 21 : -9,
        dp = t.dp == null ? 1 : t.dp;
      const val = `<tspan class="hx-val" data-hv="${esc(t.key)}" data-dp="${dp}">-----</tspan>${t.key2 ? ` / <tspan class="hx-val" data-hv="${esc(t.key2)}" data-dp="${dp}">-----</tspan>` : ''}<tspan class="hx-unit"> ${esc(t.unit || '')}</tspan>`;
      const lead = sd === 't' ? 'M0 -3V-9' : sd === 'b' ? 'M0 3V9' : sd === 'r' ? 'M3 0H7' : 'M-3 0H-7';
      taps += `<g class="hx-node hx-tap" data-open="value:${esc(t.key)}" tabindex="0" role="button" aria-label="${esc(t.label)}" transform="translate(${n1(t.x)} ${n1(t.y)})"><path class="hxd" d="${lead}"/><circle class="hx-dot" r="3.2"/><text class="hx-lab" x="${bx}" y="${y0}" text-anchor="${an}">${esc(t.label)}</text><text x="${bx}" y="${y0 + 14}" text-anchor="${an}">${val}</text>${t.tag ? `<text class="hx-tag" x="${bx}" y="${y0 + 25}" text-anchor="${an}">${esc(t.tag)}</text>` : ''}</g>`;
    }
    let tx = '';
    for (const t of P.texts || [])
      tx += `<text class="${t.cls || 'hx-note'}" x="${t.x}" y="${t.y}" text-anchor="${t.anchor || 'start'}">${esc(t.s)}</text>`;
    const legend =
      used.map(m => `<span><i style="background:var(--hx-m-${m})"></i>${MEDIA[m] || m}</span>`).join('') +
      `<em>Red = running / open · Green = stopped / closed · Grey = no signal in the app yet</em>`;
    return {
      svg: `<svg viewBox="0 0 ${W} ${P.h}" role="img" aria-label="${esc(def.title)} process">${tx}${ls}${sig}${ends}${nodes}${taps}</svg>`,
      legend
    };
  }

  /* ---------- what can be operated on a page (for the Controls view and the status line) ---------- */
  function inventory(def) {
    const seen = new Set(),
      loops = [],
      machs = [],
      valves = [];
    const add = (arr, id, name) => {
      if (!id || seen.has(arr === loops ? 'l' + id : arr === machs ? 'm' + id : 'v' + id)) return;
      seen.add(arr === loops ? 'l' + id : arr === machs ? 'm' + id : 'v' + id);
      arr.push({ id, name });
    };
    const all = def.plan ? def.plan.items : def.lanes.flatMap(L => L.items.flatMap(c => (Array.isArray(c) ? c : [c])));
    for (const it of all) {
      if (it.k === 'loop') add(loops, it.loop, it.cname || it.name);
      if (it.k === 'mach') add(machs, it.mach, it.cname || it.name);
      if (it.k === 'valve') add(valves, it.valve, it.cname || it.name);
    }
    for (const x of def.loops || []) add(loops, x[0], x[1]);
    for (const x of def.machines || []) add(machs, x[0], x[1]);
    for (const x of def.valves || []) add(valves, x[0], x[1]);
    return { loops, machs, valves };
  }
  const modeCls = m => (/MAN/i.test(m || '') ? 'man' : /REM|CAS/i.test(m || '') ? 'rem' : '');
  const modeTxt = m =>
    !m
      ? '-----'
      : /MAN/i.test(m)
        ? 'Manual'
        : /REM/i.test(m)
          ? 'Remote'
          : /CAS/i.test(m)
            ? 'Cascade'
            : /AUT/i.test(m)
              ? 'Auto'
              : m;
  const stTxt = s => (s === 'run' ? 'Running' : s === 'stop' ? 'Stopped' : s === 'trip' ? 'Tripped' : '-----');

  function drawControls(def, inv) {
    let h = '';
    if (inv.loops.length) {
      h += `<h2 class="hx-sec">Control loops · ${inv.loops.length}</h2><div class="hx-cards">`;
      for (const l of inv.loops)
        h += `<button class="hx-card" data-open="loop:${esc(l.id)}" data-card-loop="${esc(l.id)}"><span class="t"><b>${esc(l.name)}</b><span class="hx-pill" data-f="mode">-----</span></span><span class="g">${esc(l.id)}</span><span class="hx-row"><span>Measured</span><span class="hx-bar pv"><i data-f="pvb"></i></span><b data-f="pv">-----</b></span><span class="hx-row"><span>Set point</span><span></span><b data-f="sv">-----</b></span><span class="hx-row"><span>Output</span><span class="hx-bar"><i data-f="mvb"></i></span><b data-f="mv">-----</b></span></button>`;
      h += '</div>';
    }
    if (inv.machs.length) {
      h += `<h2 class="hx-sec">Machines · ${inv.machs.length}</h2><div class="hx-cards">`;
      for (const m of inv.machs)
        h += `<div class="hx-card" data-card-mach="${esc(m.id)}"><span class="t"><b>${esc(m.name)}</b><span class="hx-pill" data-f="st">-----</span></span><span class="g">${esc(m.id)}</span><span class="hx-foot"><span data-f="mode">-----</span><span><button class="hx-pill" data-open="mach:${esc(m.id)}">Control</button> <button class="hx-ynb" data-yn="${esc(m.id)}" title="Permissive · trend · monitor">-</button></span></span></div>`;
      h += '</div>';
    }
    if (inv.valves.length) {
      h += `<h2 class="hx-sec">On / off valves · ${inv.valves.length}</h2><div class="hx-cards">`;
      for (const v of inv.valves)
        h += `<button class="hx-card" data-open="valve:${esc(v.id)}" data-card-valve="${esc(v.id)}"><span class="t"><b>${esc(v.name)}</b><span class="hx-pill" data-f="st">-----</span></span><span class="g">${esc(v.id)}</span><span class="hx-foot"><span data-f="mode"></span><span data-f="pct"></span></span></button>`;
      h += '</div>';
    }
    return h || '<p style="padding:14px;color:var(--hx-mute)">Nothing is operated from this page.</p>';
  }

  /* ---------- trend recorder: one for all pages; samples the pens every STEP seconds of simulation time ---------- */
  const REC = (HX.rec = { step: 2, keep: 7200, buf: {}, last: -1e9 });
  const penVal = key => {
    const D = HX.data,
      k = key.slice(0, 3);
    if (k === 'pv:' || k === 'sv:' || k === 'mv:') return (D.loop(key.slice(3)) || {})[k.slice(0, 2)] ?? null;
    return D.value(key);
  };
  REC.watch = key => REC.buf[key] || (REC.buf[key] = []);
  REC.sample = () => {
    const t = HX.data.time();
    if (t - REC.last < REC.step) return;
    REC.last = t;
    for (const k in REC.buf) {
      const b = REC.buf[k],
        v = penVal(k);
      b.push([t, v]);
      while (b.length && t - b[0][0] > REC.keep) b.shift();
    }
  };
  function drawTrends(def) {
    if (!(def.trends || []).length)
      return '<p style="padding:14px;color:var(--hx-mute)">No trend group is set for this page yet.</p>';
    let h = `<div class="hx-span"><span>Time span</span>${[
      [300, '5 min'],
      [900, '15 min'],
      [3600, '1 h'],
      [7200, '2 h']
    ]
      .map(s => `<button data-span="${s[0]}" aria-pressed="${s[0] === 900}">${s[1]}</button>`)
      .join('')}<span style="margin-left:auto">each pen has its own scale, shown beside its name</span></div>`;
    def.trends.forEach((g, gi) => {
      g.pens.forEach(p => REC.watch(p[1]));
      h += `<div class="hx-trend" data-trend="${gi}"><h3>${esc(g.title)}</h3><svg viewBox="0 0 1000 170" preserveAspectRatio="none"></svg><div class="hx-pens">${g.pens.map((p, i) => `<div><i style="background:var(--hx-pen${(i % 6) + 1})"></i><span>${esc(p[0])} <small data-rng="${i}"></small></span><b data-pen="${i}">-----</b></div>`).join('')}</div></div>`;
    });
    return h;
  }
  function paintTrends(root, def, span) {
    const now = HX.data.time();
    root.querySelectorAll('[data-trend]').forEach(box => {
      const g = def.trends[+box.dataset.trend],
        svg = box.querySelector('svg');
      let s = '';
      for (let i = 0; i <= 4; i++)
        s += `<line class="hx-grid" x1="0" x2="1000" y1="${10 + i * 37.5}" y2="${10 + i * 37.5}" vector-effect="non-scaling-stroke"/>`;
      for (let i = 0; i <= 5; i++)
        s += `<line class="hx-grid" y1="10" y2="160" x1="${i * 200}" x2="${i * 200}" vector-effect="non-scaling-stroke"/>`;
      g.pens.forEach((p, i) => {
        const b = REC.buf[p[1]] || [];
        let lo = p[4],
          hi = p[5];
        if (lo == null || hi == null) {
          let a = Infinity,
            z = -Infinity;
          for (const [t, v] of b) if (now - t <= span && v != null) ((a = Math.min(a, v)), (z = Math.max(z, v)));
          if (!isFinite(a)) ((a = 0), (z = 1));
          const pad = Math.max((z - a) * 0.25, Math.abs(z) * 0.01, 0.05);
          lo = a - pad;
          hi = z + pad;
        }
        const rg = box.querySelector(`[data-rng="${i}"]`);
        if (rg) rg.textContent = fmt(lo, p[3] == null ? 1 : p[3]) + ' to ' + fmt(hi, p[3] == null ? 1 : p[3]);
        let d = '';
        for (const [t, v] of b) {
          if (now - t > span || v == null) continue;
          const x = 1000 - ((now - t) / span) * 1000,
            y = 160 - Math.max(0, Math.min(1, (v - lo) / (hi - lo || 1))) * 150;
          d += (d ? 'L' : 'M') + n1(x) + ' ' + n1(y);
        }
        if (d)
          s += `<path d="${d}" fill="none" style="stroke:var(--hx-pen${(i % 6) + 1})" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;

  HX.shell = function (host, opts) {

        .querySelectorAll('.hx-nav button')

      const b = e.target.closest('[data-page]');

        const t = fmt(penVal(e.dataset.hv), +e.dataset.dp);
        if (e.textContent !== t) e.textContent = t;

  };

    const had = HX.rec.buf[key],
      b = watch(key);

      l = R.loops[id] || {};
    fp = document.createElement('div');
    fp.className = 'hx-fp';
    fp.setAttribute('role', 'dialog');
    const title = second
      ? 'Permissive · trend · monitor'
      : kind === 'loop'
        ? 'Control loop'
        : kind === 'valve'
          ? 'Valve'

      let b = '';
      if (second)
        b = `<div class="kv"><span>Permissive</span><b>complete (Y)</b></div><div>Here the app shows the permissive list of ${id}, its trend and its monitor values.</div>`;

      else if (kind === 'loop') {
        const s = lp[id] || {};
        b = `<div class="kv"><span>Measured</span><b>${f1(s.pv)} ${s.unit || ''}</b></div><div class="kv"><span>Set point</span><b>${f1(s.sv)} ${s.unit || ''}</b></div><div class="kv"><span>Output</span><b>${f1(s.mv)} %</b></div><div class="bt"><button data-a="AUTO" class="${/AUT/.test(s.mode) ? 'on' : ''}">Auto</button><button data-a="MANUAL" class="${/MAN/.test(s.mode) ? 'on' : ''}">Manual</button></div><div class="bt"><button data-a="dn">Output − 5</button><button data-a="up">Output + 5</button></div>`;
      } else if (kind === 'valve') {
        const v = vv[id] || {},
          o = v.open != null ? v.open : v.pct > 1;
        b = `<div class="kv"><span>Position</span><b>${o ? 'Open' : 'Closed'}</b></div><div class="bt"><button data-a="open" class="${o ? 'on' : ''}">Open</button><button data-a="close" class="${o ? '' : 'on'}">Close</button></div>`;
      }
      fp.innerHTML = `<header><div><b>${title}: ${m.t && m.t.length > 14 ? m.t : l.t || id}</b><small>${id}${m.bind && (m.bind.ad || m.bind.mov) ? ' · ' + (m.bind.ad || m.bind.mov) : ''}</small></div><button class="x" aria-label="Close">×</button></header><div class="bd">${b}<div class="nt">Sample faceplate of the mockup. In the app this click opens the existing ${second ? 'permissive / trend / monitor' : 'control'} faceplate.</div></div>`;
    };
    draw();
    fp.addEventListener('click', e => {
      const a = e.target.dataset.a;
      if (e.target.classList.contains('x')) return fp.remove();
      if (!a) return;
      if (kind === 'mach') st[id] = a;
      if (kind === 'loop') {
        const s = lp[id] || (lp[id] = {});

          open: a === 'open',
          pct: vv[id] && vv[id].pct != null ? (a === 'open' ? 100 : 0) : undefined
        });
      draw();
    });
    document.body.append(fp);
  }
})();
