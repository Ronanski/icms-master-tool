  <rect x="16" y="16" width="480" height="480" rx="88" fill="#0f161d"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#2c3d4d" stroke-width="8"/>
  <!-- water in the drum -->
